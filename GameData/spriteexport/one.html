function rr(c,x,y,w,h,r,fill,stroke,lw){
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  if (fill){ c.fillStyle=fill; c.fill(); } if (stroke){ c.strokeStyle=stroke; c.lineWidth=lw||1; c.stroke(); }
}
function circ(c,x,y,r,fill){ c.beginPath(); c.arc(x,y,Math.max(0,r),0,Math.PI*2); c.fillStyle=fill; c.fill(); }
function ell(c,x,y,rx,ry,fill){ c.beginPath(); c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2); c.fillStyle=fill; c.fill(); }
function eyes(c,x,y,k,gap,look,angry){
  const s=k*.055, g=k*(gap||.12);
  for (const sx of [-1,1]){ ell(c,x+sx*g/2,y,s,s*1.15,'#fff'); circ(c,x+sx*g/2+(look||0)*s*.35,y+s*.15,s*.55,'#1D2226'); }
  if (angry){ c.strokeStyle='#1D2226'; c.lineWidth=k*.025; c.beginPath(); c.moveTo(x-g/2-s,y-s*1.6); c.lineTo(x-g/2+s,y-s*1.05); c.moveTo(x+g/2+s,y-s*1.6); c.lineTo(x+g/2-s,y-s*1.05); c.stroke(); }
}
const SKIN='#FFE6D8', LINE='#3B2A33';
function lineIt(c,w){ c.strokeStyle=LINE; c.lineWidth=w; c.lineJoin='round'; c.lineCap='round'; c.stroke(); }
function rrPath(c,x,y,w,h,r){ c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function fillLine(c,fill,lw){ c.fillStyle=fill; c.fill(); lineIt(c,lw); }

function chibiBackHair(c,S,hx,hy,R,lw,t){
  const st=S.style;
  c.beginPath();
  if (st==='long'){ rrPath(c,hx-R*1.1,hy-R*.95,R*2.2,R*2.15,R*.95); }
  else if (st==='bob'){ rrPath(c,hx-R*1.12,hy-R*1.0,R*2.24,R*1.8,R*.95); }
  else { c.arc(hx,hy,R*1.07,0,Math.PI*2); }
  fillLine(c,S.hair,lw);
  if (st==='twin'){
    for (const s of [-1,1]){
      if (S.drill){
        for (let i=0;i<3;i++){ c.beginPath(); c.arc(hx+s*R*(1.12+i*.04),hy+R*(.15+i*.42),R*(.36-i*.06),0,Math.PI*2); fillLine(c,S.hair,lw); }
      } else {
        c.beginPath(); c.ellipse(hx+s*R*1.12,hy+R*.75,R*.27,R*.95,s*.12,0,Math.PI*2); fillLine(c,S.hair,lw);
        if (S.tip){ c.beginPath(); rrPath(c,hx+s*R*1.2-R*.12,hy+R*1.6,R*.24,R*.2,R*.05); fillLine(c,S.tip,lw*.8); }
      }
    }
  } else if (st==='pony'){
    c.beginPath(); c.ellipse(hx+R*1.12,hy+R*.45,R*.28,R*.78,-.45,0,Math.PI*2); fillLine(c,S.hair,lw);
    circ(c,hx+R*.95,hy-R*.15,R*.12,S.accent||'#FF9A3C');
  } else if (st==='buns'){
    for (const s of [-1,1]){ c.beginPath(); c.arc(hx+s*R*.78,hy-R*.82,R*.34,0,Math.PI*2); fillLine(c,S.hair,lw); }
  }
}
function chibiBangs(c,S,hx,hy,R,lw){
  for (const s of [-1,1]){ c.beginPath(); c.ellipse(hx+s*R*.9,hy+R*.42,R*.17,R*.52,s*-.08,0,Math.PI*2); fillLine(c,S.hair,lw*.9); }
  c.beginPath();
  c.moveTo(hx-R*1.02,hy+R*.22);
  c.bezierCurveTo(hx-R*1.14,hy-R*1.45,hx+R*1.14,hy-R*1.45,hx+R*1.02,hy+R*.22);
  const pts=[[.84,-.08],[.62,-.34],[.4,0],[.14,-.38],[-.1,-.02],[-.36,-.36],[-.6,-.04],[-.84,-.32]];
  for (const [px,py] of pts) c.lineTo(hx+px*R,hy+py*R);
  c.closePath(); fillLine(c,S.hair,lw);
  c.beginPath(); c.ellipse(hx-R*.35,hy-R*.62,R*.32,R*.08,-.3,0,Math.PI*2); c.fillStyle='rgba(255,255,255,.35)'; c.fill();
}
function chibiFace(c,S,hx,hy,R,lw,u,t){
  const over=u&&u.over, sk=u&&u.skillT>0;
  const blink = u && !over && Math.sin(t*1.3+(u.id||0)*1.7)>.985;
  const ey=hy+R*.24, ex=R*.38;
  for (const s of [-1,1]){
    const cx=hx+s*ex;
    if (over){
      c.beginPath(); c.moveTo(cx-s*R*.13,ey-R*.13); c.lineTo(cx+s*R*.12,ey); c.lineTo(cx-s*R*.13,ey+R*.13); lineIt(c,lw*1.4);
    } else if (blink){
      c.beginPath(); c.arc(cx,ey-R*.02,R*.17,.15*Math.PI,.85*Math.PI); lineIt(c,lw*1.4);
    } else {
      ell(c,cx,ey,R*.2,R*.26,'#FFFFFF');
      ell(c,cx,ey+R*.03,R*.17,R*.22,S.eye);
      ell(c,cx,ey+R*.06,R*.09,R*.12,'rgba(20,18,40,.55)');
      circ(c,cx-R*.06,ey-R*.06,R*.065,'#FFFFFF'); circ(c,cx+R*.06,ey+R*.12,R*.03,'rgba(255,255,255,.85)');
      if (S.sleepy && !sk){ c.beginPath(); c.ellipse(cx,ey,R*.21,R*.27,0,Math.PI,Math.PI*2); c.fillStyle=SKIN; c.fill(); c.beginPath(); c.moveTo(cx-R*.21,ey); c.lineTo(cx+R*.21,ey); lineIt(c,lw*1.3); }
      else { c.beginPath(); c.ellipse(cx,ey,R*.21,R*.27,0,Math.PI*1.08,Math.PI*1.92); lineIt(c,lw*1.7); }
      if (sk){ c.fillStyle='#FFFFFF'; c.beginPath(); const sx=cx+R*.02, sy=ey; c.moveTo(sx,sy-R*.08); c.lineTo(sx+R*.025,sy-R*.02); c.lineTo(sx+R*.08,sy); c.lineTo(sx+R*.025,sy+R*.02); c.lineTo(sx,sy+R*.08); c.lineTo(sx-R*.025,sy+R*.02); c.lineTo(sx-R*.08,sy); c.lineTo(sx-R*.025,sy-R*.02); c.closePath(); c.fill(); }
    }
    ell(c,hx+s*R*.6,hy+R*.5,R*.14,R*.065,over?'rgba(255,90,90,.6)':'rgba(255,120,140,.45)');
  }
  if (sk||over){ c.beginPath(); c.ellipse(hx,hy+R*.58,R*.08,R*.07,0,0,Math.PI*2); c.fillStyle='#B5485A'; c.fill(); lineIt(c,lw*.7); }
  else { c.beginPath(); c.arc(hx,hy+R*.48,R*.09,.2*Math.PI,.8*Math.PI); lineIt(c,lw*.9); }
  if (over){ c.beginPath(); const dx=hx+R*.95, dy=hy-R*.2; c.moveTo(dx,dy-R*.16); c.quadraticCurveTo(dx+R*.13,dy+R*.04,dx,dy+R*.08); c.quadraticCurveTo(dx-R*.13,dy+R*.04,dx,dy-R*.16); c.fillStyle='#8FD0F5'; c.fill(); lineIt(c,lw*.7); }
}
function drawChibi(c,x,y,k,S,u,t){
  t=t||0;
  const kick=u&&u.kick>0?u.kick:0, over=u&&u.over;
  const R=k*.2, lw=Math.max(1,k*.016);
  const bob=u&&!over?Math.sin(t*3+(u.id||0))*k*.008:0;
  const hx=x+(over?k*.02:0), hy=y-k*.19+bob+(over?k*.03:0);
  ell(c,x,y+k*.33,k*.24,k*.06,'rgba(0,0,0,.18)');
  if (S.back) S.back(c,x,y,k,R,hx,hy,lw,u,t);
  chibiBackHair(c,S,hx,hy,R,lw,t);
  const legTop=y+k*.2, legH=k*.1;
  for (const s of [-1,1]){
    c.beginPath(); rrPath(c,x+s*R*.28-R*.12,legTop,R*.24,legH,R*.08); fillLine(c,S.legs||SKIN,lw*.8);
    c.beginPath(); c.ellipse(x+s*R*.3,legTop+legH,R*.18,R*.1,0,0,Math.PI*2); fillLine(c,S.shoes||LINE,lw*.8);
  }
  c.beginPath(); c.moveTo(x-R*.42,hy+R*.9); c.lineTo(x+R*.42,hy+R*.9); c.lineTo(x+R*.8,y+k*.22); c.quadraticCurveTo(x,y+k*.27,x-R*.8,y+k*.22); c.closePath(); fillLine(c,S.dress,lw);
  if (S.body) S.body(c,x,y,k,R,hx,hy,lw,u,t);
  for (const s of [-1,1]){
    c.save(); c.translate(x+s*R*.5,hy+R*1.02); c.rotate(s*-.38+(s===1&&kick?-kick*5:0)+(over?s*.25:0));
    c.beginPath(); c.ellipse(0,R*.32,R*.13,R*.34,0,0,Math.PI*2); fillLine(c,S.sleeve||S.dress,lw*.8);
    c.beginPath(); c.arc(0,R*.66,R*.11,0,Math.PI*2); fillLine(c,SKIN,lw*.7);
    c.restore();
  }
  if (S.prop) S.prop(c,x,y,k,R,hx,hy,lw,u,t,kick);
  c.beginPath(); c.ellipse(hx,hy+R*.06,R*.93,R*.86,0,0,Math.PI*2); fillLine(c,SKIN,lw);
  chibiFace(c,S,hx,hy,R,lw,u,t);
  chibiBangs(c,S,hx,hy,R,lw);
  if (S.head) S.head(c,x,y,k,R,hx,hy,lw,u,t);
}

    c.fillStyle='#1D2226'; c.beginPath(); c.moveTo(x-R*.98,hy+R*1.15); c.lineTo(x-R*1.1,hy+R*1.48); c.lineTo(x-R*.96,hy+R*1.48); c.lineTo(x-R*1.04,hy+R*1.75); c.lineTo(x-R*.84,hy+R*1.38); c.lineTo(x-R*.98,hy+R*1.38); c.closePath(); c.fill(); },
  body(c,x,y,k,R,hx,hy,lw,u,t){ c.strokeStyle='#F2C14E'; c.lineWidth=R*.1; for (const s of [-1,1]){ c.beginPath(); c.moveTo(x+s*R*.28,hy+R*.92); c.lineTo(x+s*R*.36,y+k*.2); c.stroke(); }
    if (u&&u.skillT>0) for (let i=0;i<3;i++){ const a=t*9+i*2.1; c.strokeStyle='#FFE27A'; c.lineWidth=lw*1.2; c.beginPath(); c.moveTo(x+Math.cos(a)*R*1.1,hy+R*1.2+Math.sin(a)*R*.8); c.lineTo(x+Math.cos(a)*R*1.35,hy+R*1.15+Math.sin(a)*R*.95); c.stroke(); } },
  prop(c,x,y,k,R,hx,hy,lw){ c.beginPath(); c.moveTo(x+R*.75,hy+R*1.7); c.quadraticCurveTo(x+R*1.2,y+k*.3,x+R*.4,y+k*.3); c.strokeStyle='#1D2226'; c.lineWidth=R*.07; c.stroke();
    c.beginPath(); rrPath(c,x+R*.62,hy+R*1.55,R*.26,R*.2,R*.04); fillLine(c,'#ECEFF2',lw*.7); },
  head(c,x,y,k,R,hx,hy,lw){ c.beginPath(); c.ellipse(hx,hy-R*.88,R*.95,R*.42,0,Math.PI,Math.PI*2); c.closePath(); fillLine(c,'#F2C14E',lw);
    c.beginPath(); c.ellipse(hx,hy-R*.86,R*1.08,R*.12,0,0,Math.PI*2); fillLine(c,'#E0A82E',lw); c.fillStyle='#FFFFFF'; c.fillRect(hx-R*.06,hy-R*1.25,R*.12,R*.38); } };
const DRAW = Object.fromEntries(Object.keys(CHIBI).map(id=>[id,(c,x,y,k,u,t)=>drawChibi(c,x,y,k,CHIBI[id],u,t)]));
let TS = 1;
const epos = e => ({x: e.x, y: e.y});
const segDir = () => ({x:0, y:1});
function drawEnemy(c,e,t){
  const p=epos(e), k=TS, perp=e.def.fly?segDir(e.d,e.pi):e.dir;
  const x=(p.x+perp.y*e.off)*k, y=(p.y+perp.x*e.off)*k, r=e.def.r*k;
  const bob=e.frozenT>0?0:Math.sin(t*8+e.seed)*k*.02;
  if (e.def.fly){
    const fy=y-k*.2+Math.sin(t*5+e.seed)*k*.05;
    ell(c,x,y+k*.12,r*.7,r*.25,'rgba(0,0,0,.15)');
    const flap=Math.abs(Math.sin(t*30+e.seed));
    ell(c,x-r*.6,fy-r*.5,r*.7,r*.35*(.4+flap*.6),'rgba(210,228,245,.85)');
    ell(c,x+r*.6,fy-r*.5,r*.7,r*.35*(.4+flap*.6),'rgba(210,228,245,.85)');
    ell(c,x,fy,r*.8,r*.95,'#3A3330');
    circ(c,x-r*.32,fy-r*.3,r*.26,'#D64545'); circ(c,x+r*.32,fy-r*.3,r*.26,'#D64545');
    if (e.slowT>0) circ(c,x,fy,r*1.15,'rgba(120,190,245,.28)');
    if (e.frozenT>0) rr(c,x-r*1.1,fy-r*1.1,r*2.2,r*2.2,r*.3,'rgba(190,230,250,.55)','rgba(255,255,255,.8)',1);
    hpBar(c,e,x,fy-r*1.4,r); return;
  }
  ell(c,x,y+r*.85,r*.95,r*.28,'rgba(0,0,0,.18)');
  if (e.def.breaker){ c.strokeStyle='rgba(224,82,74,.75)'; c.lineWidth=2; c.beginPath(); c.ellipse(x,y+r*.85,r*1.05,r*.34,0,0,Math.PI*2); c.stroke(); }
  const boss=e.def.boss, ek=boss?k*1.6:k;
  if (e.def.look==='mold'){
    const g=boss?'#557F38':'#6E9B4C';
    circ(c,x-r*.4,y+bob,r*.7,g); circ(c,x+r*.4,y+r*.1+bob,r*.65,g); circ(c,x,y-r*.35+bob,r*.7,g);
    circ(c,x-r*.5,y-r*.2+bob,r*.14,'#3F6B2E'); circ(c,x+r*.45,y+r*.35+bob,r*.12,'#3F6B2E'); circ(c,x+r*.1,y-r*.7+bob,r*.1,'#3F6B2E');
    eyes(c,x,y-r*.1+bob,ek,.13,0,true);
  } else if (e.def.look==='grease'){
    ell(c,x+r*.45,y+r*.65,r*.16,r*.28,'#9A6824'); ell(c,x-r*.55,y+r*.55,r*.12,r*.22,'#9A6824');
    ell(c,x,y+bob,r*1.05,r*.85,boss?'#8E5E1C':'#A8742A');
    ell(c,x-r*.35,y-r*.35+bob,r*.32,r*.16,'rgba(255,232,170,.65)');
    eyes(c,x,y+bob,ek,.13,0,true);
  } else {
    const col=boss?'#5E6267':'#8D9094', n=boss?22:14;
    c.strokeStyle=col; c.lineWidth=k*.025; c.lineCap='round';
    for (let i=0;i<n;i++){ const a=i/n*Math.PI*2+e.seed, j=1.12+.12*Math.sin(i*2.3+e.seed);
      c.beginPath(); c.moveTo(x+Math.cos(a)*r*.75,y+bob+Math.sin(a)*r*.75); c.lineTo(x+Math.cos(a)*r*j,y+bob+Math.sin(a)*r*j); c.stroke(); }
    circ(c,x,y+bob,r*.9,col); circ(c,x-r*.25,y-r*.25+bob,r*.35,boss?'#72777C':'#A2A5A8');
    eyes(c,x,y+bob-r*.05,ek,.13,0,boss);
  }
  if (boss){ c.fillStyle='#E8B23A'; c.beginPath(); const cy=y-r*.95+bob; c.moveTo(x-r*.4,cy); c.lineTo(x-r*.3,cy-r*.35); c.lineTo(x-r*.1,cy-r*.12); c.lineTo(x,cy-r*.42); c.lineTo(x+r*.1,cy-r*.12); c.lineTo(x+r*.3,cy-r*.35); c.lineTo(x+r*.4,cy); c.closePath(); c.fill(); }
  if (e.slowT>0) circ(c,x,y,r*1.15,'rgba(120,190,245,.28)');
  if (e.frozenT>0) rr(c,x-r*1.15,y-r*1.15,r*2.3,r*2.3,r*.3,'rgba(190,230,250,.6)','rgba(255,255,255,.85)',1.5);
  if (e.hitT>0){ c.fillStyle=`rgba(255,255,255,${Math.min(.75,e.hitT*6)})`; c.beginPath(); c.arc(x,y,r*1.05,0,Math.PI*2); c.fill(); }
  hpBar(c,e,x,y-r*1.35,r);
}
function hpBar(c,e,x,y,r){
  if (e.hp>=e.max) return; const w=Math.max(r*2,TS*.36);
  c.fillStyle='rgba(29,34,38,.55)'; c.fillRect(x-w/2,y,w,3);
  c.fillStyle='#E0524A'; c.fillRect(x-w/2,y,w*Math.max(0,e.hp/e.max),3);
}

// The spore only exists in 대청소, and only survEnemy() knows how to draw it.
function survEnemy(c,e,x,y,k,t){
  const r=e.r*k, bob=e.frozenT>0?0:Math.sin(t*8+e.seed)*k*.02, boss=e.def.boss, ek=boss?k*1.6:k;
  if (e.def.fly){ const fy=y-k*.15+Math.sin(t*5+e.seed)*k*.04, flap=Math.abs(Math.sin(t*30+e.seed));
    ell(c,x,y+k*.15,r*.7,r*.25,'rgba(0,0,0,.15)');
    ell(c,x-r*.6,fy-r*.5,r*.7,r*.35*(.4+flap*.6),'rgba(210,228,245,.85)'); ell(c,x+r*.6,fy-r*.5,r*.7,r*.35*(.4+flap*.6),'rgba(210,228,245,.85)');
    ell(c,x,fy,r*.8,r*.95,'#3A3330'); circ(c,x-r*.32,fy-r*.3,r*.26,'#D64545'); circ(c,x+r*.32,fy-r*.3,r*.26,'#D64545');
  } else {
    ell(c,x,y+r*.85,r*.95,r*.28,'rgba(0,0,0,.18)');
    if (e.def.look==='spore'){ const ch=e.shotT<.4?1+.18*Math.sin(t*40):1, rr2=r*ch;
      c.fillStyle='#8A6AA8'; c.beginPath(); c.ellipse(x,y-rr2*.35+bob,rr2*1.05,rr2*.62,0,Math.PI,0); c.fill();
      ell(c,x,y+rr2*.15+bob,rr2*.62,rr2*.55,'#E9DDF2'); for (const [ox,oy] of [[-.45,-.55],[.1,-.75],[.5,-.45]]) circ(c,x+ox*rr2,y+oy*rr2+bob,rr2*.14,'#D7C3EA');
      eyes(c,x,y+rr2*.12+bob,ek,.12,0,true); if (e.shotT<.4) circ(c,x,y-rr2*.9+bob,rr2*.22,'rgba(181,142,214,.85)'); }
    else if (e.def.look==='mold'){ const g='#6E9B4C'; circ(c,x-r*.4,y+bob,r*.7,g); circ(c,x+r*.4,y+r*.1+bob,r*.65,g); circ(c,x,y-r*.35+bob,r*.7,g); eyes(c,x,y-r*.1+bob,ek,.13,0,true); }
    else if (e.def.look==='grease'){ ell(c,x,y+bob,r*1.05,r*.85,'#A8742A'); ell(c,x-r*.35,y-r*.35+bob,r*.32,r*.16,'rgba(255,232,170,.65)'); eyes(c,x,y+bob,ek,.13,0,true); }
    else { const col=boss?'#5E6267':'#8D9094', n=boss?22:12; c.strokeStyle=col; c.lineWidth=k*.025; c.lineCap='round';
      for (let i=0;i<n;i++){ const a=i/n*Math.PI*2+e.seed, j=1.12+.12*Math.sin(i*2.3+e.seed); c.beginPath(); c.moveTo(x+Math.cos(a)*r*.75,y+bob+Math.sin(a)*r*.75); c.lineTo(x+Math.cos(a)*r*j,y+bob+Math.sin(a)*r*j); c.stroke(); }
      circ(c,x,y+bob,r*.9,col); circ(c,x-r*.25,y-r*.25+bob,r*.35,boss?'#72777C':'#A2A5A8'); eyes(c,x,y+bob-r*.05,ek,.13,0,boss); }
    if (boss){ c.fillStyle='#E8B23A'; c.beginPath(); const cy=y-r*.95+bob; c.moveTo(x-r*.4,cy); c.lineTo(x-r*.3,cy-r*.35); c.lineTo(x-r*.1,cy-r*.12); c.lineTo(x,cy-r*.42); c.lineTo(x+r*.1,cy-r*.12); c.lineTo(x+r*.3,cy-r*.35); c.lineTo(x+r*.4,cy); c.closePath(); c.fill(); }
  }
  if (e.slowT>0) circ(c,x,y,r*1.1,'rgba(120,190,245,.28)');
  if (e.frozenT>0) rr(c,x-r*1.1,y-r*1.1,r*2.2,r*2.2,r*.3,'rgba(190,230,250,.6)','rgba(255,255,255,.85)',1.2);
  if (e.hitT>0){ c.fillStyle=`rgba(255,255,255,${Math.min(.7,e.hitT*6)})`; c.beginPath(); c.arc(x,y,r*1.02,0,Math.PI*2); c.fill(); }
}

// --- export harness: one sprite per load, ?s=<name>&px=<size> ---
const PAD = 1.35;
const ENEMY_DEFS = {
  dust:        {look:'dust',   r:0.22, fly:0, boss:0, breaker:0},
  grease:      {look:'grease', r:0.30, fly:0, boss:0, breaker:0},
  mold:        {look:'mold',   r:0.28, fly:0, boss:0, breaker:0},
  fly:         {look:'fly',    r:0.22, fly:1, boss:0, breaker:0},
  spore:       {look:'spore',  r:0.26, fly:0, boss:0, breaker:0},
  breaker:     {look:'dust',   r:0.24, fly:0, boss:0, breaker:1},
  boss_dust:   {look:'dust',   r:0.46, fly:0, boss:1, breaker:0},
  boss_grease: {look:'grease', r:0.46, fly:0, boss:1, breaker:0},
  boss_mold:   {look:'mold',   r:0.46, fly:0, boss:1, breaker:0},
};

const q = new URLSearchParams(location.search);
const name = q.get('s');
const px = +(q.get('px') || 256);
const cv = document.createElement('canvas');
cv.width = cv.height = px;
document.body.appendChild(cv);
const ctx2 = cv.getContext('2d');

if (name.startsWith('unit_')) {
  const id = name.slice(5);
  const k = px / PAD;
  ctx2.translate(px/2, px/2 + k*0.19);
  DRAW[id](ctx2, 0, 0, k, {skillT:0, id:7, kick:0, over:false, boost:1}, 0);
} else if (name.startsWith('enemy_')) {
  const key = name.slice(6);
  const def = ENEMY_DEFS[key];
  const e = {def, x:0, y:0, d:0, pi:0, dir:{x:0,y:1}, off:0, seed:1.7,
             hp:1, max:1, hitT:0, slowT:0, frozenT:0, shotT:9, r:def.r};
  if (def.look === 'spore') {
    // survEnemy takes explicit centre + scale rather than reading TS.
    survEnemy(ctx2, e, px/2, px/2, px/2.6, 0);
  } else {
    TS = px / 2.6;
    ctx2.translate(px/2, px/2);
    drawEnemy(ctx2, e, 0);
  }
}
document.title = 'done';
