<title>오퍼레이션: 더스트 제로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-column phone game. Lobby = charcoal control-panel header + tab content + fixed bottom tab bar; battle = HUD, board, deploy cards */
:root{
  --bg:#E6EAED; --ink:#1D2226; --muted:#5D6871; --line:#C7D0D6; --card:#F7F9FA;
  --panel:#1D2226; --panel-2:#2A3136; --panel-ink:#E8EDF0; --panel-muted:#8D99A2;
  --led:#FF9A3C; --led-dim:#5A3A1E; --cool:#3D8BD9; --danger:#E0524A; --ok:#3FAE7A; --heat:#F2C14E;
  --r:#7D8B96; --r-bg:#E3E8EC; --sr:#3D8BD9; --sr-bg:#DCE9F7; --ssr:#E8842A; --ssr-bg:#FFE6CF;
  --f-display:'Do Hyeon', 'IBM Plex Sans KR', system-ui, sans-serif;
  --f-body:'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  --f-led:'Share Tech Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);padding-inline:16px;padding-block:12px 24px;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
h2,h3{margin:0;font-weight:400;font-family:var(--f-display);text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}

/* ---------- lobby ---------- */
.lobby{display:flex;flex-direction:column;gap:14px;padding-bottom:88px}
.topbar{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:24px;line-height:1;display:flex;flex-direction:column;gap:3px}
.brand small{font-family:var(--f-led);font-size:11px;letter-spacing:.32em;color:var(--led)}
.wallet{margin-left:auto;display:flex;gap:16px}
.ro{display:flex;flex-direction:column;gap:3px;min-width:0}
.ro-label{font-size:10px;color:var(--panel-muted);letter-spacing:.08em}
.led{font-family:var(--f-led);font-size:26px;line-height:1;color:var(--led);text-shadow:0 0 8px rgba(255,154,60,.45);font-variant-numeric:tabular-nums;white-space:nowrap}
.led small{font-size:14px;margin-left:2px}
.wallet .led{font-size:20px}
.led.cry{color:#7FC4F5;text-shadow:0 0 8px rgba(127,196,245,.45)}
.sec-head{display:flex;align-items:baseline;gap:8px}
.sec-head h2{font-size:24px}
.sec-head span{font-size:12px;color:var(--muted)}
.sec-head .right{margin-left:auto}
.linkbtn{background:none;border:0;padding:4px 2px;font-size:12px;font-weight:600;color:var(--cool)}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabbar .in{max-width:460px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}

/* home */
.scene{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(29,34,38,.14)}
#homeCv{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--card);border-radius:14px;padding:9px 14px;font-size:14px;font-weight:600;line-height:1.45;max-width:78%;text-align:center;box-shadow:0 4px 14px rgba(29,34,38,.15);text-wrap:balance}
.bubble::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--card)}
.bubble.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:.4}to{transform:translateX(-50%) scale(1);opacity:1}}
.plate{position:absolute;left:12px;bottom:12px;background:rgba(29,34,38,.82);color:var(--panel-ink);border-radius:10px;padding:7px 11px;display:flex;flex-direction:column;gap:1px}
.plate .rar{font-family:var(--f-led);font-size:11px;color:var(--panel-muted)}
.plate .rar[data-r="SR"]{color:#7FC4F5} .plate .rar[data-r="SSR"]{color:var(--led)}
.plate b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1}
.plate span:last-child{font-family:var(--f-led);font-size:12px;color:var(--panel-muted)}
.repbtn{position:absolute;right:12px;bottom:12px;background:rgba(29,34,38,.82);color:var(--panel-ink);border:0;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600}
.cta{background:var(--led);color:var(--panel);border:0;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 6px 18px rgba(232,132,42,.3)}
.cta .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cta .t small{font-size:12px;font-weight:600;opacity:.75}
.cta .t b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.cta .arrow{margin-left:auto;font-family:var(--f-display);font-size:28px}
.homerow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.kpi span{font-size:11px;color:var(--muted)}
.kpi b{font-family:var(--f-led);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;color:var(--muted)}
.daily{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.daily .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.daily .t b{font-weight:600;font-size:14px}
.daily .t span{font-size:12px;color:var(--muted)}
.daily button{margin-left:auto}

/* idle */
.idle{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.idle-top{display:flex;gap:12px;align-items:center}
.idle-top canvas{background:var(--panel-2);border-radius:12px;flex:none}
.idle-top .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.idle-top b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.1}
.idle-top span{font-size:12px;color:var(--panel-muted);line-height:1.5}
.idle-acc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.idle-acc div{display:flex;flex-direction:column;gap:3px;min-width:0}
.idle-acc .led{font-size:21px}
.idle-acc small{font-size:11px;color:var(--panel-muted)}
.idle-time{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-family:var(--f-led);font-size:13px;color:var(--panel-muted)}
.idle-time .meter{height:6px;border-radius:3px}
.idle-btns{display:grid;grid-template-columns:1fr auto;gap:8px}
.idle-btns .mbtn.hot:disabled{background:var(--panel-2);color:var(--panel-muted)}
.testbtn{background:none;border:1.5px dashed var(--panel-muted);color:var(--panel-muted);border-radius:10px;padding:8px 10px;font-size:11.5px;font-weight:600;line-height:1.3}
.idle.locked .idle-acc,.idle.locked .idle-time,.idle.locked .idle-btns{display:none}

/* stage progression */
.progress{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.progress p{font-size:12.5px;color:var(--panel-muted);line-height:1.55}
.progress p b{color:var(--panel-ink);font-weight:600}
.chapter{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 4px;display:flex;flex-direction:column;gap:8px}
.chapter.locked{opacity:.6}
.ch-head{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding-bottom:6px}
.ch-head canvas{border-radius:8px;display:block}
.ch-meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.ch-meta .ttl{display:flex;align-items:baseline;gap:8px}
.ch-meta .ttl small{font-family:var(--f-led);font-size:13px;color:var(--muted)}
.ch-meta .ttl b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.1}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.srow .no{font-family:var(--f-led);font-size:16px;font-variant-numeric:tabular-nums}
.srow.done .no{color:var(--ok)}
.srow.cur .no{color:var(--ssr)}
.srow .info{font-size:12px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;min-width:0}
.srow .info b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bossmark{font-size:10px;font-weight:600;background:var(--danger);color:#fff;border-radius:5px;padding:1px 6px}
.sbtn{border-radius:9px;padding:7px 14px;font-weight:600;font-size:13px;border:0;background:var(--ink);color:var(--card);white-space:nowrap}
.sbtn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.sbtn:disabled{background:var(--bg);color:var(--muted);cursor:default}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.parts span{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--muted)}
.parts b{font-family:var(--f-led);font-weight:400;font-size:14px;color:var(--ink);margin-left:4px}
.rstars{font-size:12px;letter-spacing:1px;color:var(--line)}
.rstars b,.ov-stars b{color:var(--led);font-weight:400}
.milestones{background:var(--bg);border-radius:10px;padding:10px 10px 10px;display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.ms-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.ms-head b{font-family:var(--f-led);font-weight:400;font-size:16px;color:var(--ssr)}
.ms-head small{color:var(--muted);font-size:12px}
.ms-bar{position:relative;height:6px;background:var(--line);border-radius:3px}
.ms-bar i{display:block;height:100%;background:var(--led);border-radius:3px}
.ms-bar .tick{position:absolute;top:-2px;width:2px;height:10px;background:var(--muted);transform:translateX(-1px)}
.ms-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.msb{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--muted);line-height:1.35;text-align:center}
.msb b{font-family:var(--f-led);font-weight:400;font-size:14px;color:var(--ink)}
.msb.ready{background:var(--led);border-color:var(--led);color:var(--panel)}
.msb.ready b{color:var(--panel)}
.msb.done{opacity:.55}
.msb:disabled{cursor:default}
.tab{position:relative}
.tab.alert::after{content:'';position:absolute;top:6px;right:calc(50% - 26px);width:7px;height:7px;border-radius:50%;background:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(29,34,38,.3)}
.bootmsg{padding:40px 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.tab{background:none;border:0;color:var(--panel-muted);padding:9px 4px 8px;border-radius:10px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab i{width:6px;height:6px;border-radius:50%;background:var(--panel-2)}
.tab[aria-selected="true"]{color:var(--panel-ink);background:var(--panel-2)}
.tab[aria-selected="true"] i{background:var(--led);box-shadow:0 0 6px var(--led)}

.deckstrip{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.deckstrip .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.minis{display:flex;gap:4px;flex-wrap:wrap;min-width:0;flex:1}
.mini{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--r-bg)}
.mini[data-r="SR"]{background:var(--sr-bg)} .mini[data-r="SSR"]{background:var(--ssr-bg)}

.stages{display:flex;flex-direction:column;gap:10px}
.stage-card{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.stage-card canvas{border-radius:8px;display:block}
.sc-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.sc-title{display:flex;align-items:baseline;gap:8px}
.sc-title .no{font-family:var(--f-led);font-size:14px;color:var(--muted)}
.sc-title .nm{font-family:var(--f-display);font-size:22px;line-height:1}
.stars{margin-left:auto;font-size:15px;letter-spacing:1px;color:var(--line)}
.stars b{color:var(--led);font-weight:400}
.sc-desc{font-size:12.5px;line-height:1.55;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;background:var(--bg);border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.chip.warn{background:#FCE3D1;color:#9A4A12}
.sc-foot{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:2px}
.sc-foot .rw{font-size:12px;color:var(--muted)}
.sc-foot .rw b{color:var(--ink);font-weight:600}
.go{background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:9px 18px;font-weight:600;font-size:14px;white-space:nowrap}
.go:disabled{background:var(--line);color:var(--muted);cursor:default}
.stage-card.locked{opacity:.6}

.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ut{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 0 8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;text-align:center}
.ut .pic{width:100%;aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;background:var(--r-bg)}
.ut[data-r="SR"] .pic{background:var(--sr-bg)} .ut[data-r="SSR"] .pic{background:var(--ssr-bg)}
.ut .rar{position:absolute;top:4px;left:6px;font-family:var(--f-led);font-size:11px;color:var(--r)}
.ut[data-r="SR"] .rar{color:var(--sr)} .ut[data-r="SSR"] .rar{color:var(--ssr)}
.ut .nm{font-family:var(--f-display);font-size:14px;line-height:1.2;padding-inline:2px;white-space:nowrap;overflow:hidden;max-width:100%}
.ut .lv{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ut.none .pic canvas{filter:grayscale(1) brightness(.4);opacity:.35}
.ut.none .nm{color:var(--muted)}
.ut .tag{position:absolute;top:4px;right:4px;font-size:10px;font-weight:600;background:var(--ink);color:var(--card);border-radius:5px;padding:1px 5px}

.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.slot{aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line);border-radius:10px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-size:11px;color:var(--muted)}
.slot.on{border-style:solid;background:var(--card);color:var(--ink)}
.slot.on[data-r="SR"]{background:var(--sr-bg)} .slot.on[data-r="SSR"]{background:var(--ssr-bg)}
.slot .nm{font-family:var(--f-display);font-size:12.5px;white-space:nowrap;overflow:hidden;max-width:100%}
.note{font-size:12px;color:var(--muted);line-height:1.6}

.banner{background:var(--panel);color:var(--panel-ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.banner h2{font-size:30px;color:var(--panel-ink)}
.banner p{font-size:12.5px;color:var(--panel-muted);line-height:1.6}
.banner .feat{display:flex;gap:10px;align-items:flex-end}
.banner .feat div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--panel-muted)}
.banner .feat canvas{background:var(--panel-2);border-radius:12px}
.rates{display:flex;gap:12px;font-family:var(--f-led);font-size:13px}
.rates .ssr{color:var(--led)} .rates .sr{color:#7FC4F5} .rates .r{color:var(--panel-muted)}
.pullbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pull{border:0;border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:15px}
.pull.one{background:var(--panel-2);color:var(--panel-ink)}
.pull.ten{background:var(--led);color:var(--panel)}
.pull small{font-family:var(--f-led);font-size:12px;font-weight:400;opacity:.85}
.pull:disabled{opacity:.45;cursor:default}
.pool{display:flex;flex-direction:column;gap:8px}
.pool-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.pool-row b{font-family:var(--f-led);font-weight:400;width:34px}

.reset{align-self:center;background:none;border:1.5px solid var(--line);border-radius:9px;padding:8px 14px;font-size:12px;color:var(--muted)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(29,34,38,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.mbox{background:var(--card);border-radius:16px;max-width:428px;width:100%;max-height:88vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.modal{align-items:center}}
.hero{border-radius:12px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;background:var(--r-bg)}
.hero[data-r="SR"]{background:var(--sr-bg)} .hero[data-r="SSR"]{background:var(--ssr-bg)}
.hero .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero .rar{font-family:var(--f-led);font-size:13px;color:var(--r)}
.hero[data-r="SR"] .rar{color:var(--sr)} .hero[data-r="SSR"] .rar{color:var(--ssr)}
.hero h3{font-size:28px;line-height:1}
.hero .role{font-size:12px;color:var(--muted)}
.hero .lvl{font-family:var(--f-led);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:0}
.stats div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:5px}
.stats dt{color:var(--muted)} .stats dd{margin:0;font-family:var(--f-led);font-size:14px;font-variant-numeric:tabular-nums}
.skillbox{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.skillbox b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
.mactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{border:0;border-radius:10px;padding:11px 8px;font-weight:600;font-size:14px;background:var(--ink);color:var(--card)}
.mbtn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.mbtn.hot{background:var(--led);color:var(--panel)}
.mbtn:disabled{background:var(--line);color:var(--muted);border-color:transparent;cursor:default}
.mbtn small{display:block;font-family:var(--f-led);font-weight:400;font-size:12px;opacity:.85}

.pulls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pc-card{border-radius:10px;background:var(--r-bg);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px 6px;position:relative;animation:flip .45s cubic-bezier(.2,.8,.3,1.2) both}
.pc-card[data-r="SR"]{background:var(--sr-bg)}
.pc-card[data-r="SSR"]{background:var(--ssr-bg);box-shadow:0 0 0 2px var(--ssr),0 0 16px rgba(232,132,42,.55)}
.pc-card .nm{font-family:var(--f-display);font-size:12px;white-space:nowrap;overflow:hidden;max-width:100%}
.pc-card .rar{font-family:var(--f-led);font-size:10px;color:var(--muted)}
.pc-card .tg{position:absolute;top:-5px;right:-3px;font-size:9.5px;font-weight:600;border-radius:5px;padding:1px 4px;background:var(--danger);color:#fff}
.pc-card .tg.up{background:var(--cool)} .pc-card .tg.cv{background:var(--muted)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}

/* ---------- battle ---------- */
.battle{display:flex;flex-direction:column;gap:10px}
.hud{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}

.led.life{color:#FF6B5E;text-shadow:0 0 8px rgba(255,107,94,.45)}
.led.life.low{animation:blink .6s steps(2) infinite}
.meter{height:4px;background:var(--led-dim);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--led);width:0}
.ro.right{text-align:right}
@keyframes blink{50%{opacity:.35}}

.stage{position:relative;display:flex;justify-content:center}
#cv{display:block;border-radius:12px;touch-action:manipulation;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(29,34,38,.12)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.ov-card{background:var(--card);border-radius:14px;padding:18px 18px 16px;max-width:330px;width:100%;box-shadow:0 12px 40px rgba(29,34,38,.3);display:flex;flex-direction:column;gap:10px}
.ov-card h2{font-size:26px}

<script>
(() => {
'use strict';
const COLS=7, ROWS=10;
let REGEN=1, MAX_UNITS=8, COOLDOWN=12, OVER_T=5, DECK_MAX=6, LV_MAX=30, STAR_MAX=5, LIFE_MAX=10;
const fmt = n => Math.floor(n).toLocaleString('ko-KR');
const $ = id => document.getElementById(id);

// ================= TABLES =================
// 모든 콘텐츠는 data/*.json 테이블에서 읽는다. 코드에는 규칙만 있고 수치·문자열은 없다.
const TABLE_NAMES=['enums','config','string_ko','item','unit','unit_levelup','enemy','map','stage','wave','reward_group','condition','content_unlock','star_reward','skill_param','gacha','gacha_pool'];
const DB={};
const T = k => (DB.string_ko && DB.string_ko[k]!=null) ? DB.string_ko[k] : k;
let CFG, EN, UNITS={}, LINES={}, ORDER=[], ENEMY={}, MAPS={}, STAGES=[], RG={}, COND={}, UNLOCK={}, ITEMS={}, PART_OF={}, BANNERS=[], POOLS={}, STAR_RW={}, SKILLP={};
const SKP=(id,k)=>{ const v=SKILLP[id]&&SKILLP[id][k]; if (v==null) console.warn('skill_param 없음',id,k); return v||0; };
const RANK = { R:0, SR:1, SSR:2 };
async function loadTables(){
  const packed = window.DUSTZERO_TABLES;
  if (packed && TABLE_NAMES.every(n=>packed[n])) TABLE_NAMES.forEach(n=>DB[n]=packed[n]);
  else {
    const arr = await Promise.all(TABLE_NAMES.map(n=>fetch(`data/${n}.json`).then(r=>{ if(!r.ok) throw new Error(`${n}.json (${r.status})`); return r.json(); })));
    TABLE_NAMES.forEach((n,i)=>DB[n]=arr[i]);
  }
  CFG=DB.config; EN=DB.enums;
  REGEN=CFG.regenPerSec; MAX_UNITS=CFG.maxUnits; COOLDOWN=CFG.redeployCooldown; OVER_T=CFG.overheatSec;
  DECK_MAX=CFG.deckMax; LV_MAX=CFG.lvMax; STAR_MAX=CFG.starMax; LIFE_MAX=CFG.lifeMax;
  const inv = o => Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k]));
  const RAR=inv(EN.Rarity);
  for (const it of DB.item){ ITEMS[it.id]={name:T(it.nameKey),family:it.family}; if (it.family) PART_OF[it.family]=it.id; }
  for (const u of [...DB.unit].sort((a,b)=>a.order-b.order)){
    ORDER.push(u.id);
    UNITS[u.id]={ name:T(u.nameKey), sn:T(u.shortKey), rar:RAR[u.rarity], family:u.family, role:T(u.roleKey),
      cost:u.cost, tile:u.tile===EN.Tile.Ground?'P':'H', heat:u.heat, atk:u.atk, itv:u.itv, range:u.range, block:u.block,
      sp:u.sp, dur:u.dur, cool:u.cool, skill:T(u.skillKey), desc:T(u.descKey), atkTarget:u.atkTarget||3, skillTarget:u.skillTarget||3 };
    LINES[u.id]=Array.from({length:u.lineCount},(_,i)=>T(`unit.${u.id}.line${i+1}`));
  }
  for (const e of DB.enemy) ENEMY[e.id]={ name:T(e.nameKey), hp:e.hp, spd:e.spd, dmg:e.dmg, itv:e.itv, r:e.radius, w:e.weight>1?e.weight:0, fly:!!e.fly, look:e.look, boss:!!e.boss, breaker:e.ai===EN.EnemyAI.Breaker };
  for (const m of DB.map) MAPS[m.id]=m;
  for (const r of DB.reward_group) (RG[r.groupId]=RG[r.groupId]||[]).push(r);
  for (const c of DB.condition) COND[c.id]=c;
  for (const u of DB.content_unlock) UNLOCK[u.id]=u;
  for (const p of DB.gacha_pool) (POOLS[p.poolId]=POOLS[p.poolId]||[]).push(p);
  BANNERS=DB.gacha;
  for (const r of DB.skill_param) (SKILLP[r.unitId]=SKILLP[r.unitId]||{})[r.key]=r.value;
  // 스킬 설명 템플릿의 {키}, {키_pct}를 실제 수치로 채운다 (엑셀에서 수치를 바꾸면 설명도 따라 바뀜)
  const n2=v=>+(+v).toFixed(2);
  for (const id of ORDER){ const u=UNITS[id], p=SKILLP[id]||{}, ctx={dur:u.dur,cool:u.cool};
    for (const k in p){ ctx[k]=p[k]; ctx[k+'_pct']=Math.round(p[k]*100); }
    if (p.skillIntervalMul) ctx.speedMul=1/p.skillIntervalMul;
    u.desc=u.desc.replace(/\{(\w+)\}/g,(m,k)=>ctx[k]!=null?n2(ctx[k]):m); }
  for (const r of DB.star_reward) (STAR_RW[r.chapter]=STAR_RW[r.chapter]||[]).push(r);
  for (const k in STAR_RW) STAR_RW[k].sort((a,b)=>a.needStars-b.needStars);
  const waves={}; for (const w of DB.wave) (waves[w.groupId]=waves[w.groupId]||[]).push(w);
  STAGES=[...DB.stage].sort((a,b)=>a.order-b.order).map(st=>{
    const m=MAPS[st.mapId], sched=[];
    for (const w of waves[st.waveGroup].sort((a,b)=>a.seq-b.seq)) for (let i=0;i<w.count;i++) sched.push({t:w.t+i*w.gap,type:w.enemy,pi:(w.entrance||1)-1});
    sched.sort((a,b)=>a.t-b.t);
    return { id:st.id, order:st.order, chapter:st.chapter, no:st.no, name:T(m.nameKey), floor:m.floor, spawns:m.spawnKeys.map(T), goal:T(m.goalKey),
      gim:m.gimKey?T(m.gimKey):'', desc:T(m.descKey), map:m.tiles, paths:m.paths, noEnt:m.noDeployFromEntrance||0, noGoal:m.noDeployBeforeGoal||0, sched, hpMul:st.hpMul, boss:!!st.boss,
      enemies:[...new Set(sched.map(x=>x.type))], unlockCond:st.unlockCond, firstReward:st.firstRewardGroup,
      idle:{coin:st.idleCoin, part:st.idlePart, crystal:st.idleCrystal} };
  });
}

// ================= SAVE =================
const SAVE_KEY = 'gajeon-save-v2';
let S = null;
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {} }
const inv = id => Math.floor((S.items[id]||0));
function addItem(id,n){ S.items[id]=(S.items[id]||0)+n; }
function addUnit(t){
  if (!S.owned[t]){ S.owned[t]={lv:1,star:0}; if (S.deck.length<DECK_MAX) S.deck.push(t);
    if (CFG.repRarityAutoSwap && S.rep && RANK[UNITS[t].rar]>RANK[UNITS[S.rep].rar]) S.rep=t; return 'NEW'; }
  if (S.owned[t].star<STAR_MAX){ S.owned[t].star++; return '돌파'; }
  grant(CFG.dupeOverflowRewardGroup); return '전환';
}
// 보상 그룹 지급: prob 10000 = 100%
function grant(groupId){
  const got=[];
  for (const r of (RG[groupId]||[]).sort((a,b)=>a.seq-b.seq)){
    if (Math.random()*10000 >= r.prob) continue;
    const n=r.min+Math.floor(Math.random()*(r.max-r.min+1));
    if (r.kind===EN.RewardKind.Item){ addItem(r.refId,n); got.push({item:r.refId,n}); }
    else if (r.kind===EN.RewardKind.Unit){ const tag=addUnit(r.refId); got.push({unit:r.refId,tag}); }
  }
  return got;
}
const rewardText = got => got.map(g=>g.item?`${ITEMS[g.item].name} ${fmt(g.n)}`:`${UNITS[g.unit].name}`).join(' · ');
function newSave(){
  S={ v:2, items:{}, owned:{}, deck:[], best:0, idleSince:0, idleBank:{coin:0,part:0,crystal:0}, stars:{}, starClaimed:{}, speed:1, rep:null, daily:null };
  grant(CFG.startRewardGroup); S.rep=S.rep||Object.keys(S.owned)[0];
}
function loadSave(){
  let raw=null; try { raw=JSON.parse(localStorage.getItem(SAVE_KEY)); } catch(e) {}
  if (raw && raw.v===2) S=raw;
  else {
    newSave();
    let old=null; try { old=JSON.parse(localStorage.getItem('gajeon-save-v1')); } catch(e) {}
    if (old && old.owned){ // v1 이전: 보유 가전·재화는 살리고 스테이지 진행만 초기화
      S.owned=old.owned; S.deck=old.deck||S.deck; S.rep=old.rep||S.rep; S.items[1]=old.coin||0; S.items[2]=old.crystal||0; S.daily=old.daily||null;
    }
  }
  S.deck=(S.deck||[]).filter(t=>UNITS[t]&&S.owned[t]).slice(0,DECK_MAX);
  if (!S.rep||!S.owned[S.rep]) S.rep=Object.keys(S.owned)[0];

}
const powOf = t => { const o=S.owned[t]; return o ? 1 + CFG.lvBonus*(o.lv-1) + CFG.starBonus*o.star : 1; };
function condOk(id){
  if (!id) return true; const c=COND[id]; if (!c) return true;

const chapterStars = ch => STAGES.filter(s=>s.chapter===ch).reduce((a,s)=>a+(S.stars[s.id]||0),0);
const starClaimable = ch => (STAR_RW[ch]||[]).filter(r=>!S.starClaimed[r.id] && chapterStars(ch)>=r.needStars);
const anyStarClaimable = () => Object.keys(STAR_RW).some(ch=>starClaimable(+ch).length>0);
const starStr = n => `<b>${'★'.repeat(n)}</b>${'★'.repeat(3-n)}`;
function lvCost(lv){

// ================= IDLE =================
const idleOn = () => condOk(UNLOCK.idle.cond);
const idleRate = () => S.best>0 ? STAGES[S.best-1].idle : null;
function idlePending(now){
  if (!idleOn() || !S.idleSince) return null;

  const hrs=Math.min(cap, Math.max(0,(now-S.idleSince)/3.6e6));

function bankIdle(){ // 시급이 바뀌기 직전, 지금까지 쌓인 몫을 옛 시급으로 확정
  const p=idlePending(Date.now()); if (!p) return;

}
function claimIdle(){
  const p=idlePending(Date.now()); if (!p) return null;
  const got={coin:Math.floor(p.coin), part:Math.floor(p.part), crystal:Math.floor(p.crystal)};
  addItem(1,got.coin); addItem(2,got.crystal); for (const f in PART_OF) addItem(PART_OF[f],got.part);

// ================= PATH =================
// 경로는 입구마다 하나. 적은 자기 경로(pi)의 거리 d로 움직인다.
let ST, STI=0, MAP, PATHS=[], SCHED, GOAL=[0,0];
function buildPath(wp){
  const seg=[]; let L=0;
  for (let j=0;j<wp.length-1;j++){ const [x1,y1]=wp[j],[x2,y2]=wp[j+1]; const len=Math.abs(x2-x1)+Math.abs(y2-y1); seg.push({x1,y1,x2,y2,len,start:L}); L+=len; }
  return {seg,L,start:wp[0]};
}
function loadStage(i){
  STI=i; ST=STAGES[i]; MAP=ST.map; SCHED=ST.sched; PATHS=ST.paths.map(buildPath);
  const last=ST.paths[0][ST.paths[0].length-1]; GOAL=[last[0],last[1]]; DIST_ALL=bfs(null);
}
function posAt(d,pi){
  const P=PATHS[pi||0]; d=Math.max(0,Math.min(P.L,d));
  for (const s of P.seg) if (d<=s.start+s.len){ const f=(d-s.start)/s.len; return {x:s.x1+(s.x2-s.x1)*f+.5, y:s.y1+(s.y2-s.y1)*f+.5}; }
  const s=P.seg[P.seg.length-1]; return {x:s.x2+.5,y:s.y2+.5};
}
// 지상 적은 타일 격자 위를 걷는다. 목표까지의 거리장을 매 틱 계산해서,
// 근접 가전이 서 있는 칸을 피해 돌아갈 길이 있으면 돌아가고, 완전히 막혔을 때만 가전과 맞붙는다.
let DIST_ALL=null, DIST_FREE=null;
const walkable = (c,r) => r>=0&&r<ROWS&&c>=0&&c<COLS && 'PFWE'.includes(MAP[r][c]);
function bfs(blocked){
  const D=Array.from({length:ROWS},()=>Array(COLS).fill(Infinity)); const q=[[GOAL[0],GOAL[1]]]; D[GOAL[1]][GOAL[0]]=0;
  while (q.length){ const [c,r]=q.shift(); for (const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nc=c+dc, nr=r+dr;
    if (!walkable(nc,nr) || D[nr][nc]!==Infinity || (blocked&&blocked.has(nc+','+nr))) continue; D[nr][nc]=D[r][c]+1; q.push([nc,nr]); } }
  return D;
}
function refreshDist(){
  const occ=new Set(G.units.filter(u=>u.maxHeat&&!u.over).map(u=>u.c+','+u.r));
  DIST_FREE=bfs(occ);
}
const unitAt=(c,r)=>G.units.find(u=>u.c===c&&u.r===r&&u.maxHeat&&!u.over);
const epos = e => e.def.fly ? posAt(e.d,e.pi) : {x:e.x,y:e.y};
// 목표까지 남은 거리(작을수록 앞선 적)
const erem = e => e.def.fly ? PATHS[e.pi].L-e.d : (e.tx!=null ? DIST_ALL[e.ty][e.tx]+Math.hypot(e.tx+.5-e.x,e.ty+.5-e.y) : DIST_ALL[e.cy][e.cx]);
function segDir(d,pi){ for (const s of PATHS[pi||0].seg) if (d<=s.start+s.len) return {x:Math.sign(s.x2-s.x1),y:Math.sign(s.y2-s.y1)}; return {x:0,y:1}; }
function tileDist(c,r,pi){
  for (const s of PATHS[pi].seg) if (c>=Math.min(s.x1,s.x2)&&c<=Math.max(s.x1,s.x2)&&r>=Math.min(s.y1,s.y2)&&r<=Math.max(s.y1,s.y2)) return s.start+Math.abs(c-s.x1)+Math.abs(r-s.y1);
  return null;
}
const tileDists = (c,r) => PATHS.map((_,pi)=>tileDist(c,r,pi));
function tileAtD(d,pi){ const p=posAt(d,pi); const r=Math.min(ROWS-1,Math.floor(p.y)), c=Math.min(COLS-1,Math.floor(p.x)); return MAP[r][c]; }
// 입구 앞 noEnt칸, 목표 앞 noGoal칸은 근접 배치 불가
function noDeploy(c,r){ return tileDists(c,r).some((d,pi)=>d!=null && (d<ST.noEnt || d>PATHS[pi].L-1-ST.noGoal)); }
const isGround = ch => ch==='P'||ch==='F'||ch==='W';

// ================= BATTLE STATE =================
let G = null;
function newGame(){
  const cd={}; for (const t of S.deck) cd[t]=0;
  G = { t:0, rt:G?G.rt:0, power:CFG.startPower, life:LIFE_MAX, enemies:[], units:[], fx:[], si:0, killed:0, leaked:0, cd,
        selCard:null, selUnit:null, speed:S.speed||1, paused:false, running:false, over:false, uid:0, flash:0 };
}
function spawn(type,pi){
  const def=ENEMY[type];
  const hp=def.hp*(ST.hpMul||1);
  const [sc,sr]=PATHS[pi||0].start;
  G.enemies.push({ type, def, hp, max:hp, d:0, pi:pi||0, cx:sc, cy:sr, x:sc+.5, y:sr+.5, tx:null, ty:null, dir:{x:0,y:1}, slowT:0, slowAmt:0, frozenT:0, blockedBy:null, pullBy:null, atkT:0, off:(Math.random()-.5)*.24, seed:Math.random()*10 });
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const edist=(u,e)=>{ const p=epos(e); return Math.hypot(p.x-u.x,p.y-u.y); };
function fx(k,o){ G.fx.push(Object.assign({k,life:0,max:.35},o)); }
function slow(e,amt,t){ e.slowAmt=Math.max(e.slowT>0?e.slowAmt:0,amt); e.slowT=Math.max(e.slowT,t); }
// 공격 대상 타입: 1 지상, 2 공중, 3 모두
const canHit=(e,tt)=> tt===1 ? !e.def.fly : tt===2 ? e.def.fly : true;
const inRange=(u,R,tt)=>G.enemies.filter(e=>canHit(e,tt||3) && edist(u,e)<=R);
function frontTarget(u,R,tt){ let t=null,best=Infinity; for (const e of G.enemies){ if (!canHit(e,tt||3)) continue; if (edist(u,e)<=R){ const rm=erem(e); if (rm<best){ best=rm; t=e; } } } return t; }

function update(dt){
  G.t+=dt; G.power=Math.min(CFG.powerMax,G.power+dt*REGEN); refreshDist();
  while (G.si<SCHED.length && SCHED[G.si].t<=G.t){ spawn(SCHED[G.si].type,SCHED[G.si].pi); G.si++; }
  for (const k in G.cd) G.cd[k]=Math.max(0,G.cd[k]-dt);
  if (G.flash>0) G.flash-=dt;

  for (const u of G.units){ u.atkMul=1; u.spdMul=1; u.cool=0; }
  for (const p of G.units){
    if (p.type==='pc'){ const on=p.skillT>0, rng=SKP('pc',on?'skillRange':'buffRange');
      for (const u of G.units){ if (u===p) continue; if (dist(u,p)<=rng+.01){ u.atkMul+=SKP('pc',on?'skillAtk':'buffAtk'); if (on) u.spdMul=Math.min(u.spdMul,SKP('pc','skillIntervalMul')); } } }
    else if (p.type==='fan'){ const on=p.skillT>0, rng=SKP('fan',on?'skillRange':'coolRange');
      for (const u of G.units) if (u.maxHeat && dist(u,p)<=rng+.01) u.cool+=(on?SKP('fan','skillCoolMul'):1)*p.def.cool; }
  }
  for (const u of G.units){
    if (u.maxHeat){ const ch=MAP[u.r][u.c]; if (ch==='F') u.heat+=CFG.fireTileHeatPerSec*dt; if (ch==='W') u.cool+=CFG.wetTileCoolPerSec; }
    if (u.type==='robot' && u.skillT>0) u.atkMul+=SKP('robot','skillAtkBonus');
  }
  for (const e of G.enemies) e.pullBy=null;
  for (const u of G.units){
    if (u.maxHeat){
      if (u.over){ u.heat-=(u.maxHeat/OVER_T+u.cool)*dt; if (u.heat<=0){ u.heat=0; u.over=false; fx('drop',{x:u.x,y:u.y,max:.4}); } continue; }
      u.heat=Math.max(0,u.heat-(CFG.naturalCoolPerSec+u.cool)*dt);
    }
    if (u.skillT>0){ u.skillT-=dt; if (u.skillT<=0){ u.skillT=0; onSkillEnd(u); } }
    else { u.sp=Math.min(u.def.sp,u.sp+dt); if (u.sp>=u.def.sp && wantsSkill(u)) useSkill(u); }
    BEHAV[u.type](u,dt);
  }
  for (const e of G.enemies){
    if (e.slowT>0) e.slowT-=dt;
    if (e.frozenT>0){ e.frozenT-=dt; continue; }
    if (e.blockedBy && (e.blockedBy.dead||e.blockedBy.over)) e.blockedBy=null;
    if (e.blockedBy){
      if (e.def.dmg){ e.atkT-=dt; if (e.atkT<=0){ e.atkT=e.def.itv; e.blockedBy.heat+=e.def.dmg; fx('bite',{x:e.blockedBy.x,y:e.blockedBy.y-.1,max:.25}); } }

    let sp=e.def.spd*(1-(e.slowT>0?e.slowAmt:0));

      if (MAP[e.cy][e.cx]==='W') sp*=CFG.wetTileEnemySpeedMul;
      groundStep(e,sp,dt);
      if (MAP[e.cy][e.cx]==='E'){ e.dead=true; G.leaked++; G.life-=(e.def.w||1); G.flash=.5; }
      continue;
    }
    e.d+=sp*dt;
    if (e.d>=PATHS[e.pi].L){ e.dead=true; G.leaked++; G.life-=(e.def.w||1); G.flash=.5; }
  }
  for (const u of G.units) if (u.maxHeat && !u.over && u.heat>=u.maxHeat){
    u.heat=u.maxHeat; u.over=true; u.skillT=0; fx('boom',{x:u.x,y:u.y,max:.6});
    for (const e of G.enemies) if (e.blockedBy===u) e.blockedBy=null;
  }
  for (const e of G.enemies) if (e.hp<=0 && !e.dead){ e.dead=true; G.killed++; const p=epos(e); fx('pop',{x:p.x,y:p.y,r:e.def.r,max:.4}); }
  G.enemies=G.enemies.filter(e=>!e.dead);
  for (const u of G.units) u.load=0;
  for (const e of G.enemies) if (e.blockedBy) e.blockedBy.load+=(e.def.w||1);
  for (const f of G.fx) f.life+=dt;

function chooseNext(e){
  const fc=DIST_FREE[e.cy][e.cx], D=(fc<Infinity && !e.def.breaker)?DIST_FREE:DIST_ALL;

  for (const [dc,dr] of [[0,1],[1,0],[-1,0],[0,-1]]){ const nc=e.cx+dc, nr=e.cy+dr; if (!walkable(nc,nr)) continue;
    let v=D[nr][nc]; if (D===DIST_ALL && unitAt(nc,nr)) v-=.01; if (v<bv){ bv=v; best=[nc,nr]; } }
  if (best){ e.tx=best[0]; e.ty=best[1]; } else { e.tx=e.cx; e.ty=e.cy; }
}
// 막힌 가전 앞: 자리가 있으면 붙잡히고, 정원이 찼으면 줄을 서서 과열을 민다.
function engage(e,u,dt){
  const w=e.def.w||1;
  if (u.load+w<=u.def.block){ e.blockedBy=u; u.load+=w; e.atkT=.3; return; }
  e.queuedBy=u;
  if (e.def.dmg){ e.atkT-=dt; if (e.atkT<=0){ e.atkT=e.def.itv; u.heat+=e.def.dmg*(CFG.queueHeatRatio||0); } }
}
function groundStep(e,sp,dt){
  e.queuedBy=null;

  let tx=e.tx+.5, ty=e.ty+.5, dx=tx-e.x, dy=ty-e.y, dd=Math.hypot(dx,dy);
  const occ=unitAt(e.tx,e.ty);
  if (occ){
    // 돌아갈 길이 있으면 지금 칸으로 되돌아가 경로를 다시 고른다
    if (!e.def.breaker && DIST_FREE[e.cy][e.cx]<Infinity && !(e.cx===e.tx&&e.cy===e.ty)){ e.tx=e.cx; e.ty=e.cy; return; }
    if (dd<.95){ engage(e,occ,dt); return; }
  }
  // 앞에 멈춰 선 적이 있으면 그 뒤에 줄을 선다
  if (dd>1e-3){
    const ux=dx/dd, uy=dy/dd;
    for (const o of G.enemies){
      if (o===e || o.def.fly || !(o.blockedBy||o.queuedBy)) continue;
      const ox=o.x-e.x, oy=o.y-e.y, along=ox*ux+oy*uy;
      if (along>0 && along<.34 && Math.abs(ox*uy-oy*ux)<.3){ const u=o.blockedBy||o.queuedBy; e.queuedBy=u; if (e.def.dmg){ e.atkT-=dt; if (e.atkT<=0){ e.atkT=e.def.itv; u.heat+=e.def.dmg*(CFG.queueHeatRatio||0); } } return; }
    }
    e.dir={x:Math.sign(Math.round(ux)),y:Math.sign(Math.round(uy))};

  else { e.x+=dx/dd*step; e.y+=dy/dd*step; }
}
function meleeAttack(u,dt){
  u.atkT-=dt/u.spdMul;

    const t=G.enemies.find(e=>e.blockedBy===u) || frontTarget(u,u.def.range,u.def.atkTarget);
    if (t){ t.hp-=u.def.atk*u.atkMul; u.atkT=u.def.itv; const p=epos(t); fx('hit',{x:p.x,y:p.y,max:.2}); u.kick=.15; }

const BEHAV = {
  vac(u,dt){
    if (u.skillT>0){
      for (const e of G.enemies){
        if (!canHit(e,u.def.skillTarget) || edist(u,e)>SKP('vac','pullRadius')) continue;
        e.pullBy=u; if (e.blockedBy && e.blockedBy!==u) e.blockedBy=null;
        e.hp-=SKP('vac','pullDps')*u.pow*u.atkMul*dt;

        const dx=u.x-e.x, dy=u.y-e.y, dd=Math.hypot(dx,dy), step=SKP('vac','pullSpeed')*dt;
        if (dd>.45){ const m=Math.min(step,dd-.45); e.x+=dx/dd*m; e.y+=dy/dd*m; }

  robot(u,dt){ meleeAttack(u,dt); },
  fridge(u,dt){
    if (u.skillT>0) for (const e of inRange(u,SKP('fridge','freezeRadius'),u.def.skillTarget)){ e.frozenT=Math.max(e.frozenT,.25); e.hp-=SKP('fridge','freezeDps')*u.pow*dt; }
    meleeAttack(u,dt);
  },
  ac(u,dt){
    if (u.skillT>0){ u.tick-=dt; if (u.tick<=0){ u.tick=SKP('ac','tick'); fx('ring',{x:u.x,y:u.y,r:u.def.range,max:.5,c:'61,139,217'});
      for (const e of inRange(u,u.def.range,u.def.skillTarget)){ e.hp-=SKP('ac','skillDmg')*u.pow*u.atkMul; slow(e,SKP('ac','skillSlow'),SKP('ac','skillSlowSec')); } } }
    rangedAttack(u,dt,t=>{ t.hp-=u.def.atk*u.atkMul; slow(t,SKP('ac','atkSlow'),SKP('ac','atkSlowSec')); const p=epos(t); fx('zap',{x:u.x,y:u.y,x2:p.x,y2:p.y+(t.def.fly?-.18:0),max:.25,c:'61,139,217'}); });
  },
  micro(u,dt){

  washer(u,dt){
    if (u.skillT>0){ u.tick-=dt; if (u.tick<=0){ u.tick=SKP('washer','tick'); fx('swirl',{x:u.x,y:u.y,r:u.def.range,max:.5});

    rangedAttack(u,dt,t=>{ const tp=epos(t); for (const e of G.enemies){ if (!canHit(e,u.def.atkTarget)) continue; const p=epos(e); if (Math.hypot(p.x-tp.x,p.y-tp.y)<=SKP('washer','splashRadius')) e.hp-=u.def.atk*u.atkMul; } fx('splash',{x:tp.x,y:tp.y,max:.35}); });

  pc(){}, fan(){},
};
function wantsSkill(u){
  switch (u.type){
    case 'pc': return G.units.some(o=>o!==u && o.type!=='pc' && o.type!=='fan' && dist(o,u)<=SKP('pc','skillRange'));
    case 'fan': return G.units.some(o=>o.maxHeat && dist(o,u)<=SKP('fan','coolRange')+.01 && (o.over || o.heat>=o.maxHeat*SKP('fan','triggerHeat')));
    case 'robot': return u.heat>=u.maxHeat*SKP('robot','triggerHeat');
    case 'vac': return inRange(u,SKP('vac','pullRadius'),u.def.skillTarget).length>0;
    case 'fridge': return inRange(u,SKP('fridge','freezeRadius'),u.def.skillTarget).length>0;
    default: return inRange(u,u.def.range,u.def.skillTarget).length>0;

}
function useSkill(u){
  u.sp=0; u.skillT=u.def.dur; u.tick=0; fx('skill',{x:u.x,y:u.y,max:.6});

}

const SKIN='#FFE6D8', LINE='#3B2A33';
function lineIt(c,w){ c.strokeStyle=LINE; c.lineWidth=w; c.lineJoin='round'; c.lineCap='round'; c.stroke(); }
function rrPath(c,x,y,w,h,r){ c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function fillLine(c,fill,lw){ c.fillStyle=fill; c.fill(); lineIt(c,lw); }

function chibiBackHair(c,S,hx,hy,R,lw,t){

  else if (st==='bob'){ rrPath(c,hx-R*1.12,hy-R*1.0,R*2.24,R*1.8,R*.95); }

    for (const s of [-1,1]){

        for (let i=0;i<3;i++){ c.beginPath(); c.arc(hx+s*R*(1.12+i*.04),hy+R*(.15+i*.42),R*(.36-i*.06),0,Math.PI*2); fillLine(c,S.hair,lw); }

        if (S.tip){ c.beginPath(); rrPath(c,hx+s*R*1.2-R*.12,hy+R*1.6,R*.24,R*.2,R*.05); fillLine(c,S.tip,lw*.8); }

    c.beginPath(); c.ellipse(hx+R*1.12,hy+R*.45,R*.28,R*.78,-.45,0,Math.PI*2); fillLine(c,S.hair,lw);
    circ(c,hx+R*.95,hy-R*.15,R*.12,S.accent||'#FF9A3C');
  } else if (st==='buns'){
    for (const s of [-1,1]){ c.beginPath(); c.arc(hx+s*R*.78,hy-R*.82,R*.34,0,Math.PI*2); fillLine(c,S.hair,lw); }

}
function chibiBangs(c,S,hx,hy,R,lw){
  for (const s of [-1,1]){ c.beginPath(); c.ellipse(hx+s*R*.9,hy+R*.42,R*.17,R*.52,s*-.08,0,Math.PI*2); fillLine(c,S.hair,lw*.9); }

  const pts=[[.84,-.08],[.62,-.34],[.4,0],[.14,-.38],[-.1,-.02],[-.36,-.36],[-.6,-.04],[-.84,-.32]];

function chibiFace(c,S,hx,hy,R,lw,u,t){

}
function drawChibi(c,x,y,k,S,u,t){
  t=t||0;

function drawEnemy(c,e,t){
  const p=epos(e), k=TS, perp=e.def.fly?segDir(e.d,e.pi):e.dir;
  const x=(p.x+perp.y*e.off)*k, y=(p.y+perp.x*e.off)*k, r=e.def.r*k;
  const bob=e.frozenT>0?0:Math.sin(t*8+e.seed)*k*.02;
  if (e.def.fly){
    const fy=y-k*.2+Math.sin(t*5+e.seed)*k*.05;
    ell(c,x,y+k*.12,r*.7,r*.25,'rgba(0,0,0,.15)');
    const flap=Math.abs(Math.sin(t*30+e.seed));
    ell(c,x-r*.6,fy-r*.5,r*.7,r*.35*(.4+flap*.6),'rgba(210,228,245,.85)');
    ell(c,x+r*.6,fy-r*.5,r*.7,r*.35*(.4+flap*.6),'rgba(210,228,245,.85)');
    ell(c,x,fy,r*.8,r*.95,'#3A3330');
    circ(c,x-r*.32,fy-r*.3,r*.26,'#D64545'); circ(c,x+r*.32,fy-r*.3,r*.26,'#D64545');
    if (e.slowT>0) circ(c,x,fy,r*1.15,'rgba(120,190,245,.28)');
    if (e.frozenT>0) rr(c,x-r*1.1,fy-r*1.1,r*2.2,r*2.2,r*.3,'rgba(190,230,250,.55)','rgba(255,255,255,.8)',1);
    hpBar(c,e,x,fy-r*1.4,r); return;
  }
  ell(c,x,y+r*.85,r*.95,r*.28,'rgba(0,0,0,.18)');
  if (e.def.breaker){ c.strokeStyle='rgba(224,82,74,.75)'; c.lineWidth=2; c.beginPath(); c.ellipse(x,y+r*.85,r*1.05,r*.34,0,0,Math.PI*2); c.stroke(); }
  const boss=e.def.boss, ek=boss?k*1.6:k;
  if (e.def.look==='mold'){
    const g=boss?'#557F38':'#6E9B4C';
    circ(c,x-r*.4,y+bob,r*.7,g); circ(c,x+r*.4,y+r*.1+bob,r*.65,g); circ(c,x,y-r*.35+bob,r*.7,g);
    circ(c,x-r*.5,y-r*.2+bob,r*.14,'#3F6B2E'); circ(c,x+r*.45,y+r*.35+bob,r*.12,'#3F6B2E'); circ(c,x+r*.1,y-r*.7+bob,r*.1,'#3F6B2E');
    eyes(c,x,y-r*.1+bob,ek,.13,0,true);
  } else if (e.def.look==='grease'){
    ell(c,x+r*.45,y+r*.65,r*.16,r*.28,'#9A6824'); ell(c,x-r*.55,y+r*.55,r*.12,r*.22,'#9A6824');
    ell(c,x,y+bob,r*1.05,r*.85,boss?'#8E5E1C':'#A8742A');
    ell(c,x-r*.35,y-r*.35+bob,r*.32,r*.16,'rgba(255,232,170,.65)');
    eyes(c,x,y+bob,ek,.13,0,true);
  } else {
    const col=boss?'#5E6267':'#8D9094', n=boss?22:14;
    c.strokeStyle=col; c.lineWidth=k*.025; c.lineCap='round';
    for (let i=0;i<n;i++){ const a=i/n*Math.PI*2+e.seed, j=1.12+.12*Math.sin(i*2.3+e.seed);
      c.beginPath(); c.moveTo(x+Math.cos(a)*r*.75,y+bob+Math.sin(a)*r*.75); c.lineTo(x+Math.cos(a)*r*j,y+bob+Math.sin(a)*r*j); c.stroke(); }
    circ(c,x,y+bob,r*.9,col); circ(c,x-r*.25,y-r*.25+bob,r*.35,boss?'#72777C':'#A2A5A8');
    eyes(c,x,y+bob-r*.05,ek,.13,0,boss);
  }
  if (boss){ c.fillStyle='#E8B23A'; c.beginPath(); const cy=y-r*.95+bob; c.moveTo(x-r*.4,cy); c.lineTo(x-r*.3,cy-r*.35); c.lineTo(x-r*.1,cy-r*.12); c.lineTo(x,cy-r*.42); c.lineTo(x+r*.1,cy-r*.12); c.lineTo(x+r*.3,cy-r*.35); c.lineTo(x+r*.4,cy); c.closePath(); c.fill(); }
  if (e.slowT>0) circ(c,x,y,r*1.15,'rgba(120,190,245,.28)');

  hpBar(c,e,x,y-r*1.35,r);
}
function hpBar(c,e,x,y,r){
  if (e.hp>=e.max) return; const w=Math.max(r*2,TS*.36);
  c.fillStyle='rgba(29,34,38,.55)'; c.fillRect(x-w/2,y,w,3);
  c.fillStyle='#E0524A'; c.fillRect(x-w/2,y,w*Math.max(0,e.hp/e.max),3);
}

function paintFloor(c,x,y,T,floor,col,r){
  c.fillStyle=FLOOR[floor]; c.fillRect(x,y,T,T);
  if (floor==='wood'){
    c.strokeStyle='rgba(120,84,40,.18)'; c.lineWidth=1;
    for (let i=1;i<3;i++){ c.beginPath(); c.moveTo(x,y+i*T/3); c.lineTo(x+T,y+i*T/3); c.stroke(); }
    const o=((col*7+r*3)%3)*T/3; c.beginPath(); c.moveTo(x+o,y); c.lineTo(x+o,y+T/3); c.moveTo(x+(o+T/2)%T,y+T/3); c.lineTo(x+(o+T/2)%T,y+2*T/3); c.stroke();
  } else {
    if (floor==='kitchen' && (col+r)%2===0){ c.fillStyle='rgba(29,34,38,.04)'; c.fillRect(x,y,T,T); }
    c.strokeStyle=floor==='bath'?'rgba(40,90,110,.15)':'rgba(29,34,38,.1)'; c.lineWidth=1;
    c.strokeRect(x+.5,y+.5,T-1,T-1);
    if (floor==='bath'){ c.beginPath(); c.moveTo(x+T/2,y); c.lineTo(x+T/2,y+T); c.moveTo(x,y+T/2); c.lineTo(x+T,y+T/2); c.stroke(); }
  }
}
function buildBoard(){

  const T=TS, floor=ST.floor;
  for (let r=0;r<ROWS;r++) for (let col=0;col<COLS;col++){

      c.save(); c.beginPath(); c.rect(x,y,T,T); c.clip(); c.strokeStyle='rgba(29,34,38,.07)'; c.lineWidth=1;

        c.beginPath(); c.arc(x+T/2,y+T/2,T*.14,0,Math.PI*2); c.stroke();

  } else if (ST.floor==='kitchen'){
    rr(c,X+3,Y+T*.25,T-6,T*.5,5,'#B98A57'); c.fillStyle='#8C6238'; c.fillRect(X+7,Y+T*.75,4,T*.2); c.fillRect(X+T-11,Y+T*.75,4,T*.2);
  } else {
    rr(c,X+2,Y+T*.2,T-4,T*.7,T*.25,'#F7FAFB','#9AAEBD',1.5); rr(c,X+7,Y+T*.3,T-14,T*.45,T*.18,'#9ED0EC');

  c.font=`${Math.round(T*.24)}px 'Do Hyeon', sans-serif`; c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle=ST.floor==='wood'?'#fff':'#1D2226'; c.fillText(ST.goal,X+T/2,Y+T*.55);
  c.font=`${Math.round(T*.2)}px 'Do Hyeon', sans-serif`;
  ST.paths.forEach((wp,pi)=>{ const [sx,sy]=wp[0]; c.fillStyle='#4A5A66'; c.fillText(`${pi+1} ${ST.spawns[pi]}`,sx*T+T/2,sy*T+T*.7); });
  boardCache=b;
}
function resize(){
  const w=Math.min($('stage').clientWidth||400,460);
  TS=Math.floor(w/COLS); DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=TS*COLS*DPR; cv.height=TS*ROWS*DPR; cv.style.width=TS*COLS+'px'; cv.style.height=TS*ROWS+'px';
  if (ST) buildBoard();
}
function miniMap(st){
  const c=document.createElement('canvas'), s=10; c.width=COLS*s*2; c.height=ROWS*s*2; c.style.width=COLS*s+'px'; c.style.height=ROWS*s+'px';
  const x=c.getContext('2d'); x.setTransform(2,0,0,2,0,0);
  for (let r=0;r<ROWS;r++) for (let col=0;col<COLS;col++){
    const ch=st.map[r][col];
    x.fillStyle = ch==='X'?'#C3CBD1': ch==='H'?'#F3F5F6': ch==='F'?'#2F3438': ch==='W'?'#8FC0E0': ch==='E'?'#E0524A': FLOOR[st.floor];
    x.fillRect(col*s,r*s,s,s);
  }
  x.fillStyle='#3D8BD9'; for (const wp of st.paths) x.fillRect(wp[0][0]*s+2,wp[0][1]*s+2,s-4,s-4);
  return c;
}

// ================= RENDER =================
function render(){
  const t=G.rt, k=TS; ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,COLS*k,ROWS*k);
  if (boardCache) ctx.drawImage(boardCache,0,0,COLS*k,ROWS*k);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (MAP[r][c]==='F'){
    const a=.35+.25*Math.sin(t*5+c+r); ctx.strokeStyle=`rgba(255,120,40,${a})`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(c*k+k/2,r*k+k/2,k*.26,0,Math.PI*2); ctx.stroke();
  }
  if (G.flash>0){ ctx.fillStyle=`rgba(224,82,74,${G.flash*.5})`; ctx.fillRect(GOAL[0]*k,GOAL[1]*k,k,k); }
  // 입구 경고: 3초 안에 나올 적이 있으면 붉게 깜빡이고 남은 초를 표시
  for (let pi=0;pi<PATHS.length;pi++){
    const nx=SCHED.slice(G.si).find(x=>x.pi===pi); const [sx,sy]=PATHS[pi].start;
    const live=G.enemies.some(e=>e.pi===pi && e.d<1.2);
    if (nx && nx.t-G.t<=3){
      const a=.45+.35*Math.sin(t*12); ctx.strokeStyle=`rgba(224,82,74,${a})`; ctx.lineWidth=3; ctx.strokeRect(sx*k+2,sy*k+2,k-4,k-4);
      badge(sx*k+k/2,sy*k+k*.22,`${Math.max(0,Math.ceil(nx.t-G.t))}초`,'#E0524A','#fff');
    } else if (live){ ctx.strokeStyle='rgba(224,82,74,.5)'; ctx.lineWidth=2; ctx.strokeRect(sx*k+2,sy*k+2,k-4,k-4); }
  }
  if (G.selCard && UNITS[G.selCard].tile==='P'){
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (isGround(MAP[r][c]) && noDeploy(c,r)){
      ctx.fillStyle='rgba(29,34,38,.18)'; ctx.fillRect(c*k+2,r*k+2,k-4,k-4);
      ctx.strokeStyle='rgba(29,34,38,.35)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(c*k+k*.3,r*k+k*.3); ctx.lineTo(c*k+k*.7,r*k+k*.7); ctx.moveTo(c*k+k*.7,r*k+k*.3); ctx.lineTo(c*k+k*.3,r*k+k*.7); ctx.stroke();
    }
  }
  if (G.selCard){
    const a=.35+.2*Math.sin(t*6);
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (canPlace(G.selCard,c,r)){
      ctx.fillStyle=`rgba(61,139,217,${a})`; ctx.fillRect(c*k+2,r*k+2,k-4,k-4);
      ctx.strokeStyle='rgba(61,139,217,.9)'; ctx.lineWidth=1.5; ctx.strokeRect(c*k+2.5,r*k+2.5,k-5,k-5);
    }
  }
  for (const u of G.units) if (u.type==='pc'||u.type==='fan'){
    const on=u.skillT>0, rgb=u.type==='pc'?'63,174,122':'64,178,214';
    const rng=(u.type==='pc'?SKP('pc',on?'skillRange':'buffRange'):SKP('fan',on?'skillRange':'coolRange'))*k;
    ctx.save(); ctx.setLineDash([4,5]); ctx.strokeStyle=`rgba(${rgb},${on?.85:.4})`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(u.x*k,u.y*k,rng,0,Math.PI*2); ctx.stroke(); ctx.restore();
    if (on){ ctx.fillStyle=`rgba(${rgb},.08)`; ctx.beginPath(); ctx.arc(u.x*k,u.y*k,rng,0,Math.PI*2); ctx.fill(); }
  }
  const su=G.selUnit;
  if (su){
    const on2=su.skillT>0, rng = su.type==='vac'?SKP('vac','pullRadius') : su.type==='fridge'?SKP('fridge','freezeRadius') : su.type==='pc'?SKP('pc',on2?'skillRange':'buffRange') : su.type==='fan'?SKP('fan',on2?'skillRange':'coolRange') : su.def.range;
    ctx.fillStyle='rgba(61,139,217,.1)'; ctx.beginPath(); ctx.arc(su.x*k,su.y*k,rng*k,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(61,139,217,.7)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  for (const u of G.units){
    if (u.skillT<=0) continue;
    if (u.type==='vac'){
      ctx.save(); ctx.translate(u.x*k,u.y*k); ctx.strokeStyle='rgba(228,87,46,.45)'; ctx.lineWidth=2;
      for (let i=0;i<4;i++){ const ph=(t*1.6+i/4)%1; ctx.beginPath(); ctx.arc(0,0,SKP('vac','pullRadius')*k*(1-ph),t*4+i,t*4+i+1.6); ctx.stroke(); }
      ctx.restore();
    } else if (u.type==='fridge'){
      ctx.fillStyle='rgba(170,215,245,.18)'; ctx.beginPath(); ctx.arc(u.x*k,u.y*k,SKP('fridge','freezeRadius')*k,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(120,190,245,.6)'; ctx.lineWidth=2; ctx.stroke();
    } else if (u.type==='micro'){
      ctx.strokeStyle=`rgba(255,154,60,${.4+.4*Math.sin(t*20)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(u.x*k,u.y*k,k*.45,0,Math.PI*2); ctx.stroke();
    }
  }
  for (const e of G.enemies) if (!e.def.fly) drawEnemy(ctx,e,t);
  for (const u of G.units){
    const x=u.x*k, y=u.y*k;
    if (u===su) rr(ctx,u.c*k+2,u.r*k+2,k-4,k-4,7,null,'#3D8BD9',2.5);
    DRAW[u.type](ctx,x,y,k*.92,u,t);
    const bw=k*.7, bx=x-bw/2, by=u.r*k+k-7;
    if (u.maxHeat && !u.over){
      const n=u.def.block, gap=7, x0=x-(n-1)*gap/2, py=by-11;
      for (let i=0;i<n;i++) circ(ctx,x0+i*gap,py,2.6,i<u.load?'#FF9A3C':'rgba(29,34,38,.35)');
      const q=G.enemies.filter(e=>e.queuedBy===u).length;
      if (q){ ctx.fillStyle='#E0524A'; ctx.font=`700 ${Math.max(10,Math.round(k*.2))}px 'IBM Plex Sans KR', sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(`+${q}`,x0+(n-1)*gap+6,py); }
    }
    if (u.maxHeat){ const h=u.heat/u.maxHeat; ctx.fillStyle='rgba(29,34,38,.55)'; ctx.fillRect(bx,by-5,bw,3); ctx.fillStyle=(u.over||h>.75)?'#E0524A':'#F2C14E'; ctx.fillRect(bx,by-5,bw*h,3); }
    ctx.fillStyle='rgba(29,34,38,.55)'; ctx.fillRect(bx,by,bw,3);
    if (u.skillT>0){ ctx.fillStyle='#3D8BD9'; ctx.fillRect(bx,by,bw*(u.skillT/u.def.dur),3); }
    else { ctx.fillStyle='#FF9A3C'; ctx.fillRect(bx,by,bw*(u.sp/u.def.sp),3); }
    if (u.over){
      ctx.fillStyle='rgba(224,82,74,.22)'; ctx.beginPath(); ctx.arc(x,y,k*.42,0,Math.PI*2); ctx.fill();
      for (let i=0;i<3;i++){ const ph=(t*.8+i/3)%1; circ(ctx,x+(i-1)*k*.15+Math.sin(t*3+i)*k*.04,y-k*.2-ph*k*.35,k*.07*(1-ph)+1,`rgba(255,255,255,${.85*(1-ph)})`); }
      badge(x,u.r*k+8,'과열','#E0524A','#fff');
    } else if (u.skillT<=0 && u.sp>=u.def.sp){
      badge(x,u.r*k+8,'대기','#FF9A3C','#1D2226');
    }
  }
  for (const e of G.enemies) if (e.def.fly) drawEnemy(ctx,e,t);
  for (const f of G.fx){
    const p=f.life/f.max, X=f.x*k, Y=f.y*k;
    if (f.k==='zap'){ ctx.strokeStyle=`rgba(${f.c},${1-p})`; ctx.lineWidth=3*(1-p)+1; ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(f.x2*k,f.y2*k); ctx.stroke(); }
    else if (f.k==='hit'){ ctx.strokeStyle=`rgba(255,255,255,${1-p})`; ctx.lineWidth=2; for (let i=0;i<5;i++){ const a=i*1.26; ctx.beginPath(); ctx.moveTo(X+Math.cos(a)*k*.06,Y+Math.sin(a)*k*.06); ctx.lineTo(X+Math.cos(a)*k*(.08+p*.12),Y+Math.sin(a)*k*(.08+p*.12)); ctx.stroke(); } }
    else if (f.k==='pop'){ ctx.strokeStyle=`rgba(140,144,148,${1-p})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(X,Y,f.r*k*(1+p*1.2),0,Math.PI*2); ctx.stroke(); }
    else if (f.k==='ring'){ ctx.strokeStyle=`rgba(${f.c},${.7*(1-p)})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(X,Y,f.r*k*p,0,Math.PI*2); ctx.stroke(); }
    else if (f.k==='swirl'){ ctx.strokeStyle=`rgba(61,139,217,${.8*(1-p)})`; ctx.lineWidth=3; for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(X,Y,f.r*k*(.4+p*.6),p*8+i*2.1,p*8+i*2.1+1.2); ctx.stroke(); } }
    else if (f.k==='splash'){ ctx.fillStyle=`rgba(120,190,245,${.45*(1-p)})`; ctx.beginPath(); ctx.arc(X,Y,.9*k*(.5+p*.5),0,Math.PI*2); ctx.fill(); }
    else if (f.k==='blast'){ ctx.fillStyle=`rgba(255,154,60,${.55*(1-p)})`; ctx.beginPath(); ctx.arc(X,Y,1.2*k*(.3+p*.7),0,Math.PI*2); ctx.fill(); ctx.strokeStyle=`rgba(255,240,200,${1-p})`; ctx.lineWidth=3; ctx.stroke();
      if (p<.5){ ctx.font=`${Math.round(k*.4)}px 'Do Hyeon',sans-serif`; ctx.textAlign='center'; ctx.fillStyle=`rgba(29,34,38,${1-p*2})`; ctx.fillText('띵!',X,Y-k*.6); } }
    else if (f.k==='skill'||f.k==='drop'){ ctx.strokeStyle=f.k==='skill'?`rgba(255,154,60,${1-p})`:`rgba(255,255,255,${1-p})`; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(X,Y,k*(.3+p*.5),0,Math.PI*2); ctx.stroke(); }
    else if (f.k==='bite'){ circ(ctx,X+k*.2,Y-k*.2,k*.06*(1-p)+1,`rgba(224,82,74,${1-p})`); }
    else if (f.k==='boom'){ ctx.fillStyle=`rgba(224,82,74,${.5*(1-p)})`; ctx.beginPath(); ctx.arc(X,Y,k*(.2+p*.6),0,Math.PI*2); ctx.fill(); }
  }
}
function badge(x,y,txt,bg,fg){
  const k=TS; ctx.save(); ctx.translate(x,y); rr(ctx,-k*.22,-7,k*.44,13,6,bg);
  ctx.fillStyle=fg; ctx.font=`600 ${Math.max(9,Math.round(k*.18))}px 'IBM Plex Sans KR', sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,0,0.5); ctx.restore();
}

const deckEl=$('deck'), hint=$('hint'), cards={};
function buildDeckCards(){
  deckEl.innerHTML=''; for (const k in cards) delete cards[k];
  deckEl.style.gridTemplateColumns=`repeat(${Math.max(3,S.deck.length)},minmax(0,1fr))`;
  for (const type of S.deck){
    const d=UNITS[type], b=document.createElement('button'); b.className='card'; b.dataset.r=d.rar;
    b.appendChild(icon(type,42));
    b.insertAdjacentHTML('beforeend',`<span class="nm">${d.sn}</span><span class="cost">${fmt(d.cost*100)}W</span><span class="fill"></span><span class="cdv" hidden></span>`);
    b.addEventListener('click',()=>pickCard(type));
    deckEl.appendChild(b); cards[type]=b;
  }
}
function pickCard(type){
  if (!G.running) return; const d=UNITS[type];
  if (G.selCard===type){ G.selCard=null; setHint(); return; }
  if (G.units.length>=MAX_UNITS){ setHint(`배치 한도(${MAX_UNITS}대)에 도달했어요. 기존 가전을 철수시키세요.`); return; }
  if (G.cd[type]>0){ setHint(`${d.name} 재배치 대기 중이에요.`); return; }
  if (G.power<d.cost){ setHint(`전력이 부족해요. ${fmt(d.cost*100)}W가 필요합니다.`); return; }
  G.selCard=type; closeSheet(); setHint(d.tile==='P'?`${d.name}: 바닥(적 이동 경로) 칸에 배치`:`${d.name}: 흰색 가구 위 칸에 배치`);
}
function setHint(msg){ hint.textContent = msg || (ST&&ST.gim ? `기믹 · ${ST.gim}` : '카드를 고른 뒤 빛나는 칸을 눌러 배치하세요. 스킬은 자동 발동됩니다.'); }

cv.addEventListener('pointerdown',ev=>{
  if (!G||!G.running) return;
  const rect=cv.getBoundingClientRect(); const c=Math.floor((ev.clientX-rect.left)/TS), r=Math.floor((ev.clientY-rect.top)/TS);
  const here=G.units.find(u=>u.c===c&&u.r===r);
  if (G.selCard){
    const type=G.selCard;
    if (canPlace(type,c,r) && affordable(type)){ deploy(type,c,r); G.selCard=null; setHint(); }
    else if (here){ G.selCard=null; openSheet(here); }
    else setHint('이 칸에는 배치할 수 없어요. 빛나는 칸을 눌러주세요.');
    return;
  }
  if (here) openSheet(here); else closeSheet();
});

function end(win){
  if (G.over) return; G.over=true; G.running=false; G.selCard=null; closeSheet();
  const first = win && ST.order===S.best+1;
  const stars = win ? CFG.starLifeMin.filter(v=>G.life>=v).length : 0;
  const prevStars = S.stars[ST.id]||0, newRec = stars>prevStars;
  const claimBefore = starClaimable(ST.chapter).length;
  if (newRec) S.stars[ST.id]=stars;
  const claimNew = starClaimable(ST.chapter).length>claimBefore;
  let got=[], rateLine='';
  if (first){
    const before=idleRate();
    bankIdle();
    got=grant(ST.firstReward);
    S.best=ST.order;
    if (!S.idleSince && idleOn()) S.idleSince=Date.now();
    const after=idleRate();
    rateLine = before ? `시급 코인 ${fmt(before.coin)} → <b>${fmt(after.coin)}</b>` : `자동 청소 시작! 시급 코인 <b>${fmt(after.coin)}</b>`;
  }
  persist();
  const next = win && STAGES[STI+1] && condOk(STAGES[STI+1].unlockCond);
  overlay.hidden=false;
  ovCard.innerHTML=`<h2>${win?`${ST.no} ${ST.name} 사수 성공`:`${ST.no} ${ST.name} 함락`}</h2>
    ${win?`<div class="ov-stars" aria-label="별 ${stars}개">${starStr(stars)}</div>`:''}
    <p>${first?rateLine:win?(newRec?`최고 기록 갱신! 별 ${prevStars}개 → ${stars}개`:`이미 클리어한 스테이지예요. 최고 기록은 별 ${prevStars}개입니다.`):'청결도가 0이 됐어요. 자동 청소로 모은 재화로 가전을 육성하고 다시 도전해보세요.'}</p>
    ${win&&stars<3?`<p>청결도 ${CFG.starLifeMin[stars]} 이상으로 지키면 별 ${stars+1}개예요.</p>`:''}
    ${claimNew?`<p><b>챕터 ${ST.chapter} 별 보상</b>을 받을 수 있어요. 스테이지 탭에서 받으세요.</p>`:''}
    <div class="ov-stats"><span><b>${G.killed}</b>처치</span><span><b>${Math.max(0,G.life)}</b>청결도</span><span><b>${Math.floor(G.t)}s</b>시간</span></div>
    ${got.length?`<div class="ov-rw">${got.map(g=>g.item?`<span>${ITEMS[g.item].name}<b>+${fmt(g.n)}</b></span>`:`<span>${UNITS[g.unit].name}<b>${g.tag}</b></span>`).join('')}</div>`:''}
    <div class="ov-btns"><button class="secondary" id="btnLobby">로비로</button>${next?`<button class="primary" id="btnNext">다음 ${STAGES[STI+1].no}</button>`:`<button class="primary" id="btnRetry">다시 하기</button>`}</div>`;
  $('btnLobby').addEventListener('click',()=>goLobby());
  if (next) $('btnNext').addEventListener('click',()=>startStage(STI+1));
  else $('btnRetry').addEventListener('click',()=>startStage(STI));
}
function syncBattle(){
  const life=$('roLife'); life.textContent=Math.max(0,G.life); life.classList.toggle('low',G.life<=3&&G.running);
  $('roPower').innerHTML=fmt(Math.floor(G.power)*100)+'<small>W</small>';
  $('roPowerBar').style.width=(G.power>=CFG.powerMax?100:(G.power%1)*100)+'%';
  $('roLeft').textContent=SCHED.length-G.killed-G.leaked;
  for (const type in cards){

function drawHome(t,dt){
  const c=hctx, W=HW, H=HH; c.setTransform(HD,0,0,HD,0,0);
  const fy=H*.66;
  c.fillStyle='#DCE4E9'; c.fillRect(0,0,W,fy);
  c.fillStyle='#CFD9DF'; c.fillRect(0,fy-10,W,10);
  // window
  const wx=W*.07, wy=H*.2, ww=W*.26, wh=H*.3;
  rr(c,wx-5,wy-5,ww+10,wh+10,8,'#F4F7F9'); rr(c,wx,wy,ww,wh,4,'#BFE0F2');
  circ(c,wx+ww*.72,wy+wh*.3,wh*.13,'#FFF4D6');
  c.fillStyle='#F4F7F9'; c.fillRect(wx+ww/2-2,wy,4,wh); c.fillRect(wx,wy+wh/2-2,ww,4);
  // frame on right wall
  rr(c,W*.72,H*.16,W*.14,H*.13,4,'#F4F7F9','#AEB9C1',1); rr(c,W*.735,H*.175,W*.11,H*.1,3,'#9ED0B8');
  // floor
  c.fillStyle='#DCC39A'; c.fillRect(0,fy,W,H-fy);
  c.strokeStyle='rgba(120,84,40,.16)'; c.lineWidth=1;
  for (let i=1;i<5;i++){ const y=fy+(H-fy)*i/5; c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  // sofa back-right
  const sx=W*.62, sy=fy-H*.13;
  rr(c,sx,sy,W*.34,H*.12,10,'#4A6884'); rr(c,sx,sy+H*.07,W*.34,H*.1,10,'#5B7C99');
  rr(c,sx-6,sy+H*.05,W*.05,H*.12,8,'#3E5A74'); rr(c,sx+W*.31,sy+H*.05,W*.05,H*.12,8,'#3E5A74');
  // plant
  const px=W*.1, py=fy+4;
  rr(c,px-14,py-24,28,26,5,'#B98A57');
  for (let i=0;i<5;i++){ const a=-Math.PI/2+(i-2)*.45+Math.sin(t*1.2+i)*.04; ell(c,px+Math.cos(a)*20,py-28+Math.sin(a)*22,7,14,'#6E9B4C'); }
  // rug + glow
  const cx=W/2, base=fy+(H-fy)*.55, d=UNITS[S.rep];
  ell(c,cx,base,W*.3,(H-fy)*.32,'rgba(91,124,153,.28)');
  const glow = d.rar==='SSR'?'255,154,60': d.rar==='SR'?'61,139,217':'255,255,255';
  const g=c.createRadialGradient(cx,base-H*.2,10,cx,base-H*.2,H*.42); g.addColorStop(0,`rgba(${glow},.35)`); g.addColorStop(1,`rgba(${glow},0)`);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // character
  if (hopT>0) hopT=Math.max(0,hopT-dt);
  const hop = hopT>0 ? Math.sin((1-hopT/.45)*Math.PI)*H*.06 : 0;
  const k=Math.min(W*.62,H*.62), bob=Math.sin(t*2.2)*k*.015;
  c.save(); c.translate(cx,base-k*.42-hop+bob);
  DRAW[S.rep](c,0,0,k,{skillT:0,id:7,kick:0},t);
  c.restore();
}

  if (o){
    $('btnLv').addEventListener('click',()=>{ if (!can) return; addItem(1,-c.coin); addItem(partId,-c.part); o.lv++; persist(); renderLobby(); openDetail(t); });
    $('btnDeck').addEventListener('click',()=>{ toggleDeck(t); openDetail(t); });
  }
  $('btnClose').addEventListener('click',closeModal);
  openModal();
}

// ================= GACHA =================
function rollFrom(pool){ const tot=pool.reduce((a,p)=>a+p.weight,0); let r=Math.random()*tot; for (const p of pool){ r-=p.weight; if (r<0) return p.unitId; } return pool[pool.length-1].unitId; }
function pull(b){
  if (inv(b.costItem)<b.costCount) return;
  addItem(b.costItem,-b.costCount);
  const pool=POOLS[b.poolId], RAR=Object.fromEntries(Object.entries(EN.Rarity).map(([k,v])=>[v,k]));
  const res=[];
  for (let i=0;i<b.pulls;i++){
    let t=rollFrom(pool);
    if (b.guaranteeRarity && i===b.pulls-1){
      const need=RANK[RAR[b.guaranteeRarity]];
      if (!res.some(x=>RANK[UNITS[x.t].rar]>=need) && RANK[UNITS[t].rar]<need) t=rollFrom(pool.filter(p=>RANK[UNITS[p.unitId].rar]>=need));
    }
    res.push({t,tag:addUnit(t)});
  }
  persist(); renderLobby();
  const best=res.reduce((m,x)=>Math.max(m,RANK[UNITS[x.t].rar]),0);
  mbox.innerHTML=`<div class="sec-head"><h2>소환 결과</h2><span>${best===2?'SSR 등장!':best===1?'SR 등장':''}</span></div>
    <div class="pulls" id="pulls"></div>
    <div class="mactions"><button class="mbtn ghost" id="btnClose">확인</button><button class="mbtn hot" id="btnAgain" ${inv(b.costItem)<b.costCount?'disabled':''}>${T(b.nameKey)} 더<small>${ITEMS[b.costItem].name} ${fmt(b.costCount)}</small></button></div>`;
  const g=$('pulls');
  res.forEach((x,i)=>{
    const d=UNITS[x.t], c=document.createElement('div'); c.className='pc-card'; c.dataset.r=d.rar; c.style.animationDelay=(i*.08)+'s';
    c.appendChild(icon(x.t,54));
    c.insertAdjacentHTML('beforeend',`<span class="nm">${d.sn}</span><span class="rar">${d.rar}</span><span class="tg ${x.tag==='돌파'?'up':x.tag==='전환'?'cv':''}">${x.tag}</span>`);
    g.appendChild(c);
  });
  if (b.pulls===1) g.style.gridTemplateColumns='minmax(0,96px)';
  $('btnClose').addEventListener('click',closeModal);
  $('btnAgain').addEventListener('click',()=>pull(b));
  openModal();
}

let resetArm=0;
$('btnReset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if (Date.now()-resetArm<3000){ newSave(); persist(); $('bubble').textContent=''; renderLobby(); b.textContent='초기화했어요'; setTimeout(()=>b.textContent='데이터 초기화',2000); resetArm=0; return; }
  resetArm=Date.now(); b.textContent='한 번 더 누르면 초기화'; setTimeout(()=>{ if (b.textContent==='한 번 더 누르면 초기화') b.textContent='데이터 초기화'; },3000);
});

// ================= LOOP =================
let last=performance.now(), homeT=0, idleTick=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if (G && !$('battle').hidden){
    if (G.running && !G.paused){ for (let i=0;i<G.speed;i++) update(dt); }
    G.rt+=dt; render(); syncBattle();
  } else if (curTab==='home' && !$('lobby').hidden){ homeT+=dt; drawHome(homeT,dt); idleTick+=dt; if (idleTick>1){ idleTick=0; renderIdle(); } }
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{ if (!$('battle').hidden) resize(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if (ST && !$('battle').hidden) buildBoard(); });
(async()=>{
  try { await loadTables(); }
  catch(err){ $('bootMsg').textContent=`데이터 테이블을 불러오지 못했어요 (${err.message}). 새로고침해 주세요.`; return; }
  loadSave(); $('bootMsg').hidden=true; $('lobby').hidden=false; $('idleIcon').appendChild(icon('robot',52));
  renderLobby(); setTab('home');
})();
requestAnimationFrame(frame);
})();
</script>
