<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>더스트 제로 · 가전 모션</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#253143;font-family:system-ui,sans-serif}header{padding:30px 5vw 20px;background:#172435;color:#fff;position:sticky;top:0;z-index:2}h1{font-size:25px;margin:0 0 8px}p{margin:6px 0 16px;color:#b9c8d9}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{font:inherit;border:1px solid #61748b;border-radius:20px;background:#293d55;color:#fff;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:#ffbb68;border-color:#ffbb68;color:#172435}label{margin-left:10px;font-size:13px}main{max-width:1200px;margin:auto;padding:28px 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{min-width:0;border-radius:20px;background:#fff;padding:12px;text-align:center;box-shadow:0 5px 20px #233a5710}canvas{width:100%;aspect-ratio:1;display:block}h2{font-size:16px;margin:0 0 6px}small{color:#76859b;font-size:11px}.status{font-size:12px;color:#b9c8d9;margin-top:12px}@media(max-width:750px){main{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:20px}h1{font-size:20px}}</style>
<header><h1>더스트 제로 · 가전 모션</h1><p>가전 16종의 기본 동작과 스킬을 살펴보세요.</p><nav><button data-mode="attack" aria-pressed="true">기본 동작 · 3프레임</button><button data-mode="skill" aria-pressed="false">스킬 · 6프레임</button><button data-mode="idle" aria-pressed="false">대기</button><button id="pause">일시정지</button><label>재생 속도 <select id="speed"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label></nav><div class="status" id="status">이미지를 불러오고 있어요.</div></header><main id="cards"></main>
<script src="art/261022-motion/metrics.js?v=10.22-g"></script><script src="art/261022-motion/motion.js?v=10.22-g"></script><script>
const names={vac:'청소기',robot:'로봇청소기',fridge:'냉장고',ac:'에어컨',micro:'전자레인지',washer:'세탁기',pc:'컴퓨터',fan:'선풍기',gen:'발전기',iron:'다리미',stove:'가스레인지',boiler:'보일러',blender:'믹서기',purifier:'공기청정기',router:'공유기',tv:'스마트TV'};
const ids=Object.keys(names),cards=[],idle={};let mode='attack',paused=false,time=0,last=performance.now();
for(const id of ids){const card=document.createElement('article'),cv=document.createElement('canvas');cv.width=cv.height=560;card.innerHTML=`<h2>${names[id]}</h2>`;card.appendChild(cv);card.insertAdjacentHTML('beforeend',`<small>${['pc','fan','gen'].includes(id)?'기본 지원 동작 · 스킬':'기본 공격 · 스킬'}</small>`);document.getElementById('cards').appendChild(card);cards.push({id,cv,c:cv.getContext('2d')});const img=new Image();img.src=`art/261022/${id}_sd.webp`;idle[id]=img;}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;time=0;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'계속 재생':'일시정지';};
DZ_MOTION.load(ids).then(()=>document.getElementById('status').textContent='10.22-g · 16종 · 기본 동작 48프레임 + 스킬 96프레임');
function frame(now){if(!paused)time+=Math.min(.05,(now-last)/1000)*Number(document.getElementById('speed').value);last=now;
 for(const {id,cv,c} of cards){c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,280,280);const k=240,x=140,y=150,cycle=mode==='skill'?1.45:1.05,phase=time%cycle,active=mode!=='idle'&&phase<(mode==='skill'?.84:.36);const m=active?DZ_MOTION.pick(id,{motionPreview:mode},phase):null;
 c.fillStyle='#263c5020';c.beginPath();c.ellipse(x,y+k*.33,k*.24,k*.045,0,0,Math.PI*2);c.fill();
 if(m&&m.image){const n=m.frame,s=k*1.02*m.scale;c.drawImage(m.image,n%3*320,Math.floor(n/3)*320,320,320,x-s/2,y+k*.33-s*.94,s,s);DZ_MOTION.effects(c,id,x,y,k,m,false);}else{const img=idle[id];if(img.complete&&img.naturalWidth){const s=Math.min(k*.82/img.naturalWidth,k*.88/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;c.drawImage(img,x-w/2,y+k*.33-h,w,h);}}
 }requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
